<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chart of Accounts · GoldBooks</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <style>
    .coa-row { display:flex; align-items:center; padding:.6rem .9rem; border-bottom:1px solid var(--line-soft); transition:background .15s; }
    .coa-row:hover { background: var(--gold-50); }
    .coa-row .twisty { width:22px; cursor:pointer; color:var(--ink-400); font-size:1.1rem; transition:transform .2s; flex-shrink:0; }
    .coa-row .twisty.open { transform: rotate(90deg); }
    .coa-row .ac-name { font-weight:600; color:var(--ink-900); }
    .coa-row.is-group .ac-name { font-weight:700; }
    .coa-row .ac-code { color:var(--ink-400); font-size:.78rem; margin-right:.6rem; font-variant-numeric:tabular-nums; }
    .coa-icon { width:26px;height:26px;border-radius:7px;display:grid;place-items:center;margin-right:.6rem;font-size:1rem;flex-shrink:0; }
    .root-Asset{background:var(--info-soft);color:var(--info)} .root-Liability{background:var(--danger-soft);color:var(--danger)}
    .root-Equity{background:var(--gold-50);color:var(--gold-600)} .root-Income{background:var(--success-soft);color:var(--success)}
    .root-Expense{background:var(--warning-soft);color:var(--warning)}
    .coa-row[data-drill] { cursor:pointer; }
    .coa-row[data-drill]:hover .ac-name { color:var(--gold-700); text-decoration:underline; }
    .coa-child { display:none; }
    .coa-child.show { display:block; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Chart of Accounts</h1>
            <div class="crumb">Accounting · <b>Chart of Accounts</b></div>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft" id="expandAll"><i class="bx bx-expand-vertical"></i> Expand All</button>
            <button class="btn btn-gold" data-bs-toggle="modal" data-bs-target="#acctModal"><i class="bx bx-plus"></i> New Account</button>
          </div>
        </div>

        <!-- Root-type summary -->
        <div class="row g-3 mb-3" id="rootSummary" data-aos="fade-up"></div>

        <div class="card" data-aos="fade-up">
          <div class="card-pad d-flex align-items-center">
            <h5 class="card-title">Account Tree</h5>
            <div class="ms-auto" style="max-width:260px;width:100%">
              <input id="coaSearch" class="form-control form-control-sm" placeholder="Filter accounts…">
            </div>
          </div>
          <div id="coaTree"></div>
        </div>
      </main>
    </div>
  </div>

  <!-- New Account Modal -->
  <div class="modal fade" id="acctModal" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);border:none">
        <div class="modal-header" style="border-bottom:1px solid var(--line)">
          <h5 class="modal-title fw-8">New Account</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-6"><label class="form-label">Account Code</label><input class="form-control" id="fCode" placeholder="e.g. 1150"></div>
            <div class="col-6"><label class="form-label">Account Name</label><input class="form-control" id="fName" placeholder="e.g. Petty Cash"></div>
            <div class="col-6"><label class="form-label">Parent Account</label><select class="form-select" id="fParent"></select></div>
            <div class="col-6"><label class="form-label">Root Type</label>
              <select class="form-select" id="fRoot"><option>Asset</option><option>Liability</option><option>Equity</option><option>Income</option><option>Expense</option></select>
            </div>
            <div class="col-6"><label class="form-label">Account Type</label>
              <select class="form-select" id="fType"><option value="">—</option><option>Bank</option><option>Cash</option><option>Receivable</option><option>Payable</option><option>Stock</option><option>Fixed Asset</option><option>Tax</option><option>Income Account</option><option>Expense Account</option><option>Cost of Goods Sold</option><option>Equity</option></select>
            </div>
            <div class="col-6"><label class="form-label">Opening Balance</label><input class="form-control" id="fOpen" value="0.00"></div>
            <div class="col-12">
              <div class="form-check"><input class="form-check-input" type="checkbox" id="fGroup"><label class="form-check-label" for="fGroup">This is a Group (header) account</label></div>
            </div>
          </div>
        </div>
        <div class="modal-footer" style="border-top:1px solid var(--line)">
          <button class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-gold" id="saveAcct"><i class="bx bx-check"></i> Save Account</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('coa');

      var ACCOUNTS = [];
      App.data('accounts.json').done(function (d) {
        ACCOUNTS = d.accounts;
        renderSummary(d.accounts, d.currency);
        renderTree(d.accounts, d.currency);
        fillParents(d.accounts);
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });

      function renderSummary(accts, cur) {
        var roots = ['Asset', 'Liability', 'Equity', 'Income', 'Expense'];
        var icons = { Asset: 'bx-buildings', Liability: 'bx-credit-card', Equity: 'bx-pie-chart-alt', Income: 'bx-trending-up', Expense: 'bx-trending-down' };
        var html = roots.map(function (r) {
          var top = accts.find(function (a) { return a.root_type === r && a.parent === null; });
          var bal = top ? top.balance : 0;
          var count = accts.filter(function (a) { return a.root_type === r && !a.is_group; }).length;
          return '<div class="col-6 col-md-4 col-xl">' +
            '<div class="card card-hover card-pad">' +
              '<div class="coa-icon root-' + r + '" style="width:38px;height:38px;font-size:1.3rem"><i class="bx ' + icons[r] + '"></i></div>' +
              '<div class="kpi-label mt-2">' + r + '</div>' +
              '<div class="fw-8 tabular" style="font-size:1.1rem;color:var(--ink-900)">' + App.currency(bal, cur) + '</div>' +
              '<div class="card-sub">' + count + ' ledgers</div>' +
            '</div></div>';
        }).join('');
        $('#rootSummary').html(html);
      }

      function buildTree(accts, parent) {
        return accts.filter(function (a) { return a.parent === parent; })
          .map(function (a) { return { node: a, children: buildTree(accts, a.id) }; });
      }

      function renderTree(accts, cur) {
        var roots = buildTree(accts, null);
        $('#coaTree').html(roots.map(function (r) { return nodeHtml(r, 0, cur); }).join(''));
      }

      function nodeHtml(item, depth, cur) {
        var a = item.node, kids = item.children;
        var hasKids = kids.length > 0;
        var pad = 12 + depth * 22;
        var twisty = hasKids ? '<i class="bx bx-chevron-right twisty" data-id="' + a.id + '"></i>' : '<span class="twisty"></span>';
        var icon = '<span class="coa-icon root-' + a.root_type + '"><i class="bx ' + (a.is_group ? 'bx-folder' : 'bx-file') + '"></i></span>';
        var drill = a.is_group ? '' : ' data-drill="' + a.code + ' · ' + a.name + '"';
        var row = '<div class="coa-row ' + (a.is_group ? 'is-group' : '') + '" style="padding-left:' + pad + 'px" data-name="' + a.name.toLowerCase() + '"' + drill + (a.is_group ? '' : ' title="View ledger"') + '>' +
          twisty + icon +
          '<span class="ac-code">' + a.code + '</span>' +
          '<span class="ac-name">' + a.name + '</span>' +
          '<span class="ms-auto d-flex align-items-center gap-2">' +
            '<span class="badge-soft badge-draft">' + a.root_type + '</span>' +
            (a.account_type ? '<span class="badge-soft" style="background:var(--gold-50);color:var(--gold-700)">' + a.account_type + '</span>' : '') +
            '<span class="fw-bold tabular" style="min-width:120px;text-align:right;color:var(--ink-900)">' + App.currency(a.balance, cur) + '</span>' +
          '</span></div>';
        var childHtml = '';
        if (hasKids) {
          childHtml = '<div class="coa-child" data-parent="' + a.id + '">' + kids.map(function (k) { return nodeHtml(k, depth + 1, cur); }).join('') + '</div>';
        }
        return row + childHtml;
      }

      // Drill into ledger for a ledger account (ignore clicks on the twisty)
      $(document).on('click', '.coa-row[data-drill]', function (e) {
        if ($(e.target).closest('.twisty').length) return;
        location.href = 'general-ledger.html?account=' + encodeURIComponent($(this).data('drill'));
      });

      // Expand / collapse
      $(document).on('click', '.twisty[data-id]', function () {
        var id = $(this).data('id');
        $(this).toggleClass('open');
        $('.coa-child[data-parent="' + id + '"]').toggleClass('show');
      });
      var expanded = false;
      $('#expandAll').on('click', function () {
        expanded = !expanded;
        $('.coa-child').toggleClass('show', expanded);
        $('.twisty[data-id]').toggleClass('open', expanded);
        $(this).html(expanded ? '<i class="bx bx-collapse-vertical"></i> Collapse All' : '<i class="bx bx-expand-vertical"></i> Expand All');
      });

      // Filter
      $('#coaSearch').on('input', function () {
        var q = $(this).val().toLowerCase();
        if (!q) { $('.coa-row').show(); $('.coa-child').removeClass('show'); $('.twisty[data-id]').removeClass('open'); return; }
        $('.coa-child').addClass('show'); $('.twisty[data-id]').addClass('open');
        $('.coa-row').each(function () { $(this).toggle($(this).data('name').indexOf(q) > -1); });
      });

      function fillParents(accts) {
        var opts = '<option value="">— None (Root) —</option>' + accts.filter(function (a) { return a.is_group; })
          .map(function (a) { return '<option value="' + a.id + '">' + a.code + ' · ' + a.name + '</option>'; }).join('');
        $('#fParent').html(opts);
      }

      // Save (client-side demo: validates + injects into tree)
      $('#saveAcct').on('click', function () {
        var code = $('#fCode').val().trim(), name = $('#fName').val().trim();
        if (!code || !name) { App.toast('Code and Name are required', 'error'); return; }
        var newAcct = {
          id: Date.now(), code: code, name: name,
          parent: $('#fParent').val() ? Number($('#fParent').val()) : null,
          is_group: $('#fGroup').is(':checked'),
          root_type: $('#fRoot').val(), account_type: $('#fType').val(),
          balance: parseFloat($('#fOpen').val()) || 0
        };
        ACCOUNTS.push(newAcct);
        renderTree(ACCOUNTS, '₹'); fillParents(ACCOUNTS);
        bootstrap.Modal.getInstance(document.getElementById('acctModal')).hide();
        App.toast('Account "' + name + '" created (demo — not persisted)');
        $('#fCode,#fName,#fOpen').val(''); $('#fGroup').prop('checked', false);
      });
    });
  </script>
</body>
</html>
