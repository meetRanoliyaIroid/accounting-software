<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bank Reconciliation · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <style>
    .stmt-line { border:1px solid var(--line); border-radius:var(--radius-sm); padding:.7rem .9rem; margin-bottom:.6rem; transition:.2s; cursor:pointer; }
    .stmt-line:hover { border-color:var(--gold-300); background:var(--gold-50); }
    .stmt-line.matched { border-color:var(--success); background:var(--success-soft); }
    .stmt-line.matched .stmt-pick { display:none; }
    .match-tag { font-size:.72rem; font-weight:700; color:var(--success); }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Bank Reconciliation</h1>
            <div class="crumb">Banking · <b>Reconciliation</b></div>
          </div>
          <div class="head-actions">
            <button class="btn btn-outline-gold" id="autoMatch"><i class="bx bx-wand-2"></i> Auto-Match</button>
            <button class="btn btn-gold" id="reconcile"><i class="bx bx-check-double"></i> Reconcile</button>
          </div>
        </div>

        <!-- Summary -->
        <div class="row g-3 mb-3" data-aos="fade-up">
          <div class="col-6 col-xl-3"><div class="card card-pad"><div class="kpi-label">Ledger Balance</div><div class="fw-8" id="kLedger" style="color:var(--ink-900);font-size:1.2rem">₹0</div></div></div>
          <div class="col-6 col-xl-3"><div class="card card-pad"><div class="kpi-label">Statement Closing</div><div class="fw-8" id="kStmt" style="color:var(--ink-900);font-size:1.2rem">₹0</div></div></div>
          <div class="col-6 col-xl-3"><div class="card card-pad"><div class="kpi-label">Matched</div><div class="fw-8 text-gold" id="kMatched" style="font-size:1.2rem">0 / 0</div></div></div>
          <div class="col-6 col-xl-3"><div class="card card-pad"><div class="kpi-label">Difference</div><div class="fw-8" id="kDiff" style="font-size:1.2rem">₹0</div></div></div>
        </div>

        <div class="row g-3">
          <!-- Statement lines -->
          <div class="col-lg-7">
            <div class="card" data-aos="fade-up">
              <div class="card-pad d-flex align-items-center"><div><h5 class="card-title">Bank Statement</h5><div class="card-sub" id="bankName"></div></div>
                <span class="badge-soft badge-draft ms-auto" id="lineCount"></span>
              </div>
              <div class="card-pad pt-0" id="stmtList"></div>
            </div>
          </div>
          <!-- Unmatched system vouchers -->
          <div class="col-lg-5">
            <div class="card" data-aos="fade-up">
              <div class="card-pad"><h5 class="card-title">Unmatched System Entries</h5><div class="card-sub">Vouchers in the ledger not yet reconciled</div></div>
              <div class="table-wrap"><table class="report-table"><thead><tr><th>Voucher</th><th class="num">Amount</th></tr></thead><tbody id="voucherRows"></tbody></table></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('bank');
      var CUR = '₹', LINES = [], VOUCHERS = [], DATA = {};

      App.data('bank-statement.json').done(function (d) {
        DATA = d; CUR = d.currency; LINES = d.statement_lines; VOUCHERS = d.system_vouchers.slice();
        $('#bankName').text(d.bank_account);
        $('#kLedger').text(App.currency(d.ledger_balance, CUR));
        $('#kStmt').text(App.currency(d.statement_closing, CUR));
        renderLines(); renderVouchers(); updateSummary();
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });

      function voucherOptions(line) {
        var amt = line.deposit || line.withdrawal;
        return '<option value="">Match voucher…</option>' + VOUCHERS.map(function (v) {
          var vamt = v.debit || v.credit;
          var near = Math.abs(vamt - amt) < 0.01;
          return '<option value="' + v.id + '"' + (near ? ' data-suggest="1"' : '') + '>' + v.id + ' · ' + App.currency(vamt, CUR) + '</option>';
        }).join('');
      }

      function renderLines() {
        $('#stmtList').html(LINES.map(function (l) {
          var amt = l.deposit || l.withdrawal;
          var dir = l.deposit ? '<span class="text-success fw-bold">+' + App.currency(l.deposit, CUR) + '</span>' : (l.withdrawal ? '<span class="text-danger fw-bold">−' + App.currency(l.withdrawal, CUR) + '</span>' : '<span class="text-muted-2">₹0.00</span>');
          return '<div class="stmt-line" data-id="' + l.id + '">' +
            '<div class="d-flex align-items-center">' +
              '<div><div class="fw-bold" style="color:var(--ink-900)">' + l.description + '</div><div class="card-sub">' + App.shortDate(l.date) + '</div></div>' +
              '<div class="ms-auto text-end">' + dir +
                '<div class="match-tag mt-1" style="display:none"><i class="bx bx-link"></i> <span class="matched-with"></span></div>' +
              '</div>' +
            '</div>' +
            '<div class="stmt-pick mt-2"><select class="form-select form-select-sm line-voucher" data-amt="' + amt + '">' + voucherOptions(l) + '</select></div>' +
          '</div>';
        }).join(''));
      }

      function renderVouchers() {
        $('#voucherRows').html(VOUCHERS.map(function (v) {
          var vamt = v.debit || v.credit;
          return '<tr data-vid="' + v.id + '"><td><span class="fw-bold text-gold">' + v.id + '</span><div class="card-sub">' + v.type + ' · ' + v.party + '</div></td>' +
            '<td class="num tabular ' + (v.debit ? 'text-success' : 'text-danger') + '">' + (v.debit ? '+' : '−') + App.number(vamt) + '</td></tr>';
        }).join('') || '<tr><td colspan="2" class="text-center text-muted-2 py-3"><i class="bx bx-check-circle text-success"></i> All entries reconciled</td></tr>');
      }

      function matchLine($line, vid) {
        var v = VOUCHERS.find(x => x.id === vid);
        if (!v) return;
        $line.addClass('matched').data('matched', vid);
        $line.find('.matched-with').text('Matched to ' + vid);
        $line.find('.match-tag').show();
        VOUCHERS = VOUCHERS.filter(x => x.id !== vid);
        renderVouchers(); updateSummary();
      }

      $(document).on('change', '.line-voucher', function () {
        var vid = $(this).val(); if (!vid) return;
        matchLine($(this).closest('.stmt-line'), vid);
      });

      $('#autoMatch').on('click', function () {
        $('.stmt-line').not('.matched').each(function () {
          var $line = $(this);
          var id = $line.data('id');
          var line = LINES.find(l => l.id === id);
          if (line && line.suggested && VOUCHERS.find(v => v.id === line.suggested)) {
            matchLine($line, line.suggested);
          }
        });
        App.toast('Auto-matched ' + $('.stmt-line.matched').length + ' lines by amount & date');
      });

      function updateSummary() {
        var matched = $('.stmt-line.matched').length;
        $('#kMatched').text(matched + ' / ' + LINES.length);
        $('#lineCount').text(LINES.length + ' lines');
        // difference = unmatched voucher amount sum (signed)
        var unmatched = VOUCHERS.reduce((s, v) => s + (v.debit - v.credit), 0);
        var diff = +unmatched.toFixed(2);
        $('#kDiff').text(App.currency(diff, CUR)).css('color', diff === 0 ? 'var(--success)' : 'var(--danger)');
      }

      $('#reconcile').on('click', function () {
        var unmatched = LINES.length - $('.stmt-line.matched').length;
        if (VOUCHERS.length === 0) App.toast('Reconciled — ledger matches statement, difference ₹0.00');
        else App.toast(unmatched + ' line(s) still unmatched. Match all to reconcile.', 'error');
      });
    });
  </script>
</body>
</html>
