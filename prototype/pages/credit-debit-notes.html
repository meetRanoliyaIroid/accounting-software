<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit &amp; Debit Notes · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <style>
    .gl-preview { background: var(--gold-50); border:1px dashed var(--gold-300); border-radius: var(--radius); }
    .tot-line { display:flex; justify-content:space-between; padding:.35rem 0; }
    .tot-line.grand { border-top:2px solid var(--line); margin-top:.3rem; padding-top:.6rem; font-size:1.15rem; font-weight:800; color:var(--ink-900); }
    .seg { display:inline-flex; background:var(--bg-soft); border-radius:999px; padding:.25rem; gap:.25rem; }
    .seg button { border:none; background:transparent; padding:.4rem .9rem; border-radius:999px; font-weight:700; font-size:.85rem; color:var(--ink-700); }
    .seg button.active { background:#fff; color:var(--gold-700); box-shadow:var(--shadow-sm); }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div><h1>Credit &amp; Debit Notes</h1><div class="crumb">Accounting · <b>Notes</b></div></div>
          <div class="head-actions">
            <button class="btn btn-soft d-none" id="btnBack"><i class="bx bx-arrow-back"></i> Back</button>
            <button class="btn btn-gold" id="btnNew"><i class="bx bx-plus"></i> New Note</button>
          </div>
        </div>

        <div class="mb-3" data-aos="fade-up"><div class="seg">
          <button class="tab-btn active" data-tab="cn">Credit Notes <span class="card-sub">(Customers)</span></button>
          <button class="tab-btn" data-tab="dn">Debit Notes <span class="card-sub">(Suppliers)</span></button>
        </div></div>

        <div id="listView">
          <div class="row g-3 mb-3" id="kpiRow"></div>
          <div class="tab-pane" data-pane="cn">
            <div class="card"><div class="card-pad d-flex align-items-center"><h5 class="card-title me-auto">Credit Note Register</h5><div style="max-width:220px;width:100%"><input id="searchC" class="form-control form-control-sm" placeholder="Search…"></div></div>
              <div class="table-wrap"><table class="tbl"><thead><tr><th>Note No.</th><th>Customer</th><th>Against</th><th>Date</th><th>Reason</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody id="cRows"></tbody></table></div>
            </div>
          </div>
          <div class="tab-pane d-none" data-pane="dn">
            <div class="card"><div class="card-pad d-flex align-items-center"><h5 class="card-title me-auto">Debit Note Register</h5><div style="max-width:220px;width:100%"><input id="searchD" class="form-control form-control-sm" placeholder="Search…"></div></div>
              <div class="table-wrap"><table class="tbl"><thead><tr><th>Note No.</th><th>Supplier</th><th>Against</th><th>Date</th><th>Reason</th><th class="num">Total</th><th>Status</th><th></th></tr></thead><tbody id="dRows"></tbody></table></div>
            </div>
          </div>
        </div>

        <div id="detailView" class="d-none"></div>

        <div id="formView" class="d-none">
          <div class="row g-3"><div class="col-lg-8"><div class="card card-pad" data-aos="fade-up"><div class="row g-3" id="formHead"></div></div></div>
          <div class="col-lg-4">
            <div class="card card-pad mb-3" data-aos="fade-up"><h5 class="card-title mb-3">Amount</h5>
              <div class="mb-2"><label class="form-label">Taxable Amount *</label><input class="form-control num text-end" id="fNet" value="0"></div>
              <div class="mb-2"><label class="form-label">Tax</label><select class="form-select" id="fTax"></select></div>
              <div class="tot-line"><span class="text-muted-2">Net</span><span class="tabular fw-bold" id="sNet">₹0.00</span></div>
              <div class="tot-line"><span class="text-muted-2">Tax</span><span class="tabular fw-bold" id="sTax">₹0.00</span></div>
              <div class="tot-line grand"><span>Note Total</span><span class="tabular text-gold" id="sTotal">₹0.00</span></div>
              <div class="d-grid gap-2 mt-3"><button class="btn btn-gold" id="saveBtn"><i class="bx bx-check"></i> Issue Note</button></div>
            </div>
            <div class="card card-pad gl-preview" data-aos="fade-up"><h6 class="fw-8 mb-2"><i class="bx bx-transfer-alt text-gold"></i> GL Posting Preview</h6><table class="tbl" style="background:transparent"><tbody id="glRows"></tbody></table></div>
          </div></div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('notes');
      var CN = [], DN = [], CUR = '₹', REASONS = [], CUSTOMERS = [], SUPPLIERS = [], SALES = [], PURCH = [], TAXES = [], GR = {}, TAB = 'cn', cseq = 4, dseq = 3;

      $.when(App.data('notes.json'), App.data('customers.json'), App.data('suppliers.json'), App.data('sales-invoices.json'), App.data('purchase-invoices.json'), App.data('taxes.json'), App.data('settings.json'))
        .done(function (n, cu, su, si, pi, tx, st) {
          CN = n[0].credit_notes; DN = n[0].debit_notes; CUR = n[0].currency; REASONS = n[0].reasons;
          CUSTOMERS = cu[0].customers; SUPPLIERS = su[0].suppliers; SALES = si[0].invoices; PURCH = pi[0].invoices; TAXES = tx[0].taxes;
          GR = (st[0] || {}).gr_policy || { salesman_gr_limit: 0 };
          renderKpis(); renderC(); renderD();
        }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });
      function isReturn(reason) { return /return/i.test(reason || ''); }

      function taxRate(n) { var t = TAXES.find(x => x.name === n); return t ? t.rate : 0; }

      function renderKpis() {
        var cnt = CN.reduce((s, x) => s + x.total, 0), dnt = DN.reduce((s, x) => s + x.total, 0);
        $('#kpiRow').html(
          '<div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon red"><i class="bx bx-up-arrow-circle"></i></div><div><div class="kpi-label">Credit Notes Value</div><div class="kpi-value">' + App.currency(cnt, CUR) + '</div></div></div></div>' +
          '<div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon blue"><i class="bx bx-down-arrow-circle"></i></div><div><div class="kpi-label">Debit Notes Value</div><div class="kpi-value">' + App.currency(dnt, CUR) + '</div></div></div></div>' +
          '<div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon gold"><i class="bx bx-receipt"></i></div><div><div class="kpi-label">Credit Notes</div><div class="kpi-value">' + CN.length + '</div></div></div></div>' +
          '<div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon green"><i class="bx bx-receipt"></i></div><div><div class="kpi-label">Debit Notes</div><div class="kpi-value">' + DN.length + '</div></div></div></div>');
      }

      function renderC() {
        var q = ($('#searchC').val() || '').toLowerCase();
        var list = CN.filter(x => x.no.toLowerCase().includes(q) || x.customer.toLowerCase().includes(q));
        $('#cRows').html(list.length ? list.map(x => '<tr class="row-click" style="cursor:pointer" data-t="cn" data-id="' + x.id + '"><td><span class="fw-bold text-gold">' + x.no + '</span></td><td>' + x.customer + '</td><td class="text-muted-2">' + x.against + '</td><td class="text-muted-2">' + App.shortDate(x.date) + '</td><td>' + x.reason + '</td><td class="num tabular fw-bold">' + App.currency(x.total, CUR) + '</td><td>' + App.statusBadge('Submitted').replace('Submitted', x.status) + '</td><td class="text-end">' + App.kebab(x.id, [{ act: 'view', icon: 'bx-show', label: 'View' }]) + '</td></tr>').join('') : '<tr><td colspan="8" class="text-center text-muted-2 py-4">No credit notes</td></tr>');
      }
      function renderD() {
        var q = ($('#searchD').val() || '').toLowerCase();
        var list = DN.filter(x => x.no.toLowerCase().includes(q) || x.supplier.toLowerCase().includes(q));
        $('#dRows').html(list.length ? list.map(x => '<tr class="row-click" style="cursor:pointer" data-t="dn" data-id="' + x.id + '"><td><span class="fw-bold text-gold">' + x.no + '</span></td><td>' + x.supplier + '</td><td class="text-muted-2">' + x.against + '</td><td class="text-muted-2">' + App.shortDate(x.date) + '</td><td>' + x.reason + '</td><td class="num tabular fw-bold">' + App.currency(x.total, CUR) + '</td><td>' + App.statusBadge('Submitted').replace('Submitted', x.status) + '</td><td class="text-end">' + App.kebab(x.id, [{ act: 'view', icon: 'bx-show', label: 'View' }]) + '</td></tr>').join('') : '<tr><td colspan="8" class="text-center text-muted-2 py-4">No debit notes</td></tr>');
      }
      $('#searchC').on('input', renderC); $('#searchD').on('input', renderD);

      $('.tab-btn').on('click', function () { $('.tab-btn').removeClass('active'); $(this).addClass('active'); TAB = $(this).data('tab'); showList(); });
      function showList() { $('#formView,#detailView').addClass('d-none'); $('#listView').removeClass('d-none'); $('#btnBack').addClass('d-none'); $('#btnNew').removeClass('d-none'); $('.tab-pane').addClass('d-none'); $('.tab-pane[data-pane="' + TAB + '"]').removeClass('d-none'); }
      $('#btnBack').on('click', showList);

      function glFor(note, type) {
        if (type === 'cn') return [{ a: '4100 · Sales Revenue (Returns)', d: note.net, c: 0 }, { a: '2120 · GST Output Tax', d: note.tax, c: 0 }, { a: '1130 · Debtors', d: 0, c: note.total }];
        return [{ a: '2110 · Accounts Payable', d: note.total, c: 0 }, { a: '5100 · Purchases / COGS', d: 0, c: note.net }, { a: '2130 · GST Input Credit', d: 0, c: note.tax }];
      }
      $(document).on('click', '.row-click', function (e) { if ($(e.target).closest('.dropdown').length) return; var t = $(this).data('t'); showDetail(t === 'cn' ? CN.find(x => x.id == $(this).data('id')) : DN.find(x => x.id == $(this).data('id')), t); });
      $(document).on('click', '[data-act="view"]', function () { var t = TAB; showDetail(t === 'cn' ? CN.find(x => x.id == $(this).data('id')) : DN.find(x => x.id == $(this).data('id')), t); });

      function showDetail(x, type) {
        if (!x) return;
        $('#listView,#formView').addClass('d-none'); $('#detailView').removeClass('d-none'); $('#btnBack').removeClass('d-none'); $('#btnNew').addClass('d-none');
        var party = type === 'cn' ? x.customer : x.supplier, label = type === 'cn' ? 'Credit Note' : 'Debit Note';
        var gl = glFor(x, type);
        $('#detailView').html('<div class="card card-pad mb-3"><div class="d-flex flex-wrap align-items-start gap-3"><div><div class="kpi-label">' + label + '</div><h2 class="fw-8 mb-0 text-gold">' + x.no + '</h2><div class="card-sub mt-1">' + party + ' · against ' + x.against + ' · ' + App.shortDate(x.date) + '</div></div><div class="ms-auto text-end"><span class="badge-soft badge-paid">' + x.status + '</span><div class="mt-2"><div class="kpi-label">Note Total</div><div class="fw-8 text-gold" style="font-size:1.5rem">' + App.currency(x.total, CUR) + '</div></div></div></div><div class="divider"></div><div class="row g-3"><div class="col-md-3"><div class="kpi-label">Reason</div><div class="fw-bold">' + x.reason + '</div></div><div class="col-md-3"><div class="kpi-label">Taxable</div><div class="fw-bold">' + App.currency(x.net, CUR) + '</div></div><div class="col-md-3"><div class="kpi-label">Tax (' + x.tax_name + ')</div><div class="fw-bold">' + App.currency(x.tax, CUR) + '</div></div><div class="col-md-3"><div class="kpi-label">Total</div><div class="fw-bold text-gold">' + App.currency(x.total, CUR) + '</div></div></div>' + (x.remark ? '<div class="card-sub mt-2"><i class="bx bx-note"></i> ' + x.remark + '</div>' : '') + '</div>' +
          '<div class="row g-3"><div class="col-lg-5"><div class="card card-pad gl-preview"><h6 class="fw-8 mb-2"><i class="bx bx-transfer-alt text-gold"></i> Posted GL Entries</h6><table class="tbl" style="background:transparent"><tbody>' + gl.map(g => '<tr><td class="small">' + g.a + '</td><td class="num tabular small">' + (g.d ? App.number(g.d) : '—') + '</td><td class="num tabular small">' + (g.c ? App.number(g.c) : '—') + '</td></tr>').join('') + '</tbody></table></div></div></div>');
      }

      // ---- form ----
      $('#btnNew').on('click', function () { openForm(TAB); });
      function openForm(type) {
        $('#listView,#detailView').addClass('d-none'); $('#formView').removeClass('d-none'); $('#btnBack').removeClass('d-none'); $('#btnNew').addClass('d-none');
        var isCN = type === 'cn';
        var parties = isCN ? CUSTOMERS : SUPPLIERS, docs = isCN ? SALES : PURCH, dlabel = isCN ? 'Invoice' : 'Bill';
        $('#formHead').html(
          '<div class="col-md-4"><label class="form-label">' + (isCN ? 'Credit' : 'Debit') + ' Note No.</label><input class="form-control" id="fNo" value="' + (isCN ? 'CN-2026-' + String(cseq).padStart(3, '0') : 'DN-2026-' + String(dseq).padStart(3, '0')) + '" readonly></div>' +
          '<div class="col-md-4"><label class="form-label">Date</label><input class="form-control" type="date" id="fDate" value="2026-06-24"></div>' +
          '<div class="col-md-4"><label class="form-label">' + (isCN ? 'Customer' : 'Supplier') + ' *</label><select class="form-select" id="fParty"><option value="">Select…</option>' + parties.map(p => '<option>' + p.name + '</option>').join('') + '</select></div>' +
          '<div class="col-md-6"><label class="form-label">Against ' + dlabel + '</label><select class="form-select" id="fAgainst"><option value="">Select ' + dlabel + '…</option>' + docs.map(d => '<option>' + d.no + '</option>').join('') + '</select></div>' +
          '<div class="col-md-6"><label class="form-label">Reason</label><select class="form-select" id="fReason">' + REASONS.map(r => '<option>' + r + '</option>').join('') + '</select></div>' +
          (isCN ? '<div class="col-md-6"><label class="form-label">Salesman (for GR limit)</label><input class="form-control" id="fSalesman" placeholder="Optional"></div>' : '') +
          '<div class="col-md-12"><label class="form-label">Remark</label><input class="form-control" id="fRemark"></div>' +
          '<div class="col-md-12"><div id="grHint" class="small text-muted-2"></div></div>');
        $(document).off('change.gr').on('change.gr', '#fReason, #fAgainst, #fNet', updateGrHint);
        var taxScope = isCN ? TAXES.filter(t => t.scope !== 'Purchase') : TAXES.filter(t => t.scope !== 'Sales');
        $('#fTax').html('<option value="">No Tax</option>' + taxScope.map(t => '<option>' + t.name + '</option>').join(''));
        $('#fNet').val(0); $('#formView').data('type', type); recalc();
      }
      function updateGrHint() {
        var type = $('#formView').data('type'), reason = $('#fReason').val(), against = $('#fAgainst').val(), net = parseFloat($('#fNet').val()) || 0;
        var tn = $('#fTax').val(), tax = tn ? net * taxRate(tn) / 100 : 0, total = net + tax;
        var parts = [];
        if (against) parts.push('<i class="bx bx-link text-gold"></i> Issuing this note reduces the outstanding of <b>' + against + '</b> (reflects in Outstanding + Ledger).');
        if (type === 'cn' && isReturn(reason)) {
          var lim = GR.salesman_gr_limit || 0;
          if (lim && total > lim) parts.push('<span class="text-danger"><i class="bx bx-error-circle"></i> Goods Return ' + App.currency(total, CUR) + ' exceeds salesman GR limit of ' + App.currency(lim, CUR) + ' — needs manager approval.</span>');
          else if (lim) parts.push('<i class="bx bx-check-circle text-success"></i> Within salesman GR limit (' + App.currency(lim, CUR) + ').');
        }
        $('#grHint').html(parts.join('<br>'));
      }
      $(document).on('input', '#fNet', function () { recalc(); updateGrHint(); }); $(document).on('change', '#fTax', function () { recalc(); updateGrHint(); });
      function recalc() {
        var net = parseFloat($('#fNet').val()) || 0, tn = $('#fTax').val(), tax = tn ? net * taxRate(tn) / 100 : 0, total = net + tax;
        $('#sNet').text(App.currency(net, CUR)); $('#sTax').text(App.currency(tax, CUR)); $('#sTotal').text(App.currency(total, CUR));
        var gl = glFor({ net: net, tax: tax, total: total }, $('#formView').data('type'));
        $('#glRows').html(gl.map(g => '<tr><td class="small">' + g.a + '</td><td class="num tabular small">' + (g.d ? App.number(g.d) : '—') + '</td><td class="num tabular small">' + (g.c ? App.number(g.c) : '—') + '</td></tr>').join(''));
      }
      $('#saveBtn').on('click', function () {
        var type = $('#formView').data('type'), party = $('#fParty').val();
        if (!party) { App.toast('Select a party', 'error'); return; }
        var net = parseFloat($('#fNet').val()) || 0; if (net <= 0) { App.toast('Enter taxable amount', 'error'); return; }
        var tn = $('#fTax').val(), tax = tn ? net * taxRate(tn) / 100 : 0, total = net + tax;
        var reason = $('#fReason').val();
        if (type === 'cn' && isReturn(reason) && GR.salesman_gr_limit && total > GR.salesman_gr_limit) {
          App.toast('Goods Return ' + App.currency(total, CUR) + ' exceeds salesman GR limit ' + App.currency(GR.salesman_gr_limit, CUR) + ' — manager approval required', 'error'); return;
        }
        var obj = { id: Date.now(), no: $('#fNo').val(), date: $('#fDate').val(), against: $('#fAgainst').val() || '—', reason: reason, salesman: $('#fSalesman').val() || '', net: net, tax_name: tn || '—', tax: tax, total: total, status: 'Issued', remark: $('#fRemark').val() };
        if (type === 'cn') { obj.customer = party; CN.unshift(obj); cseq++; renderC(); TAB = 'cn'; } else { obj.supplier = party; DN.unshift(obj); dseq++; renderD(); TAB = 'dn'; }
        $('.tab-btn').removeClass('active'); $('.tab-btn[data-tab="' + TAB + '"]').addClass('active');
        renderKpis(); showList(); App.toast((type === 'cn' ? 'Credit' : 'Debit') + ' note issued — GL + Outstanding updated' + ($('#fAgainst').val() ? ' (reduced ' + $('#fAgainst').val() + ')' : '') + ' (demo)');
      });
    });
  </script>
</body>
</html>
