<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Activity Log · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <style>
    .act-pill { font-size:.7rem; font-weight:700; padding:.18rem .55rem; border-radius:999px; }
    .a-post { background:var(--success-soft); color:var(--success); }
    .a-edit { background:var(--gold-50); color:var(--gold-700); }
    .a-create { background:#e7f0ff; color:#2563eb; }
    .a-close { background:var(--success-soft); color:var(--success); }
    .a-lock { background:var(--danger-soft); color:var(--danger); }
    .a-block { background:var(--danger-soft); color:var(--danger); }
    .a-approve { background:#ecfdf5; color:#059669; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Activity Log</h1>
            <div class="crumb">System · <b>Audit Trail (all departments)</b></div>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft" onclick="window.print()"><i class="bx bx-printer"></i> Export</button>
          </div>
        </div>

        <div class="row g-3 mb-3" data-aos="fade-up" id="kpis"></div>

        <div class="card card-pad mb-3" data-aos="fade-up">
          <div class="row g-3 align-items-end">
            <div class="col-md-3"><label class="form-label">Department</label><select id="fDept" class="form-select form-select-sm"><option value="">All Departments</option></select></div>
            <div class="col-md-3"><label class="form-label">Module</label><select id="fModule" class="form-select form-select-sm"><option value="">All Modules</option></select></div>
            <div class="col-md-3"><label class="form-label">Action</label><select id="fAction" class="form-select form-select-sm"><option value="">All Actions</option></select></div>
            <div class="col-md-3"><label class="form-label">Search</label><input id="fSearch" class="form-control form-control-sm" placeholder="User, document, detail…"></div>
          </div>
        </div>

        <div class="card" data-aos="fade-up">
          <div class="card-pad"><h5 class="card-title" id="logTitle">Audit Trail</h5></div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>Time</th><th>User</th><th>Department</th><th>Module</th><th>Action</th><th>Document</th><th>Detail</th></tr></thead>
              <tbody id="rows"><tr><td colspan="7" class="text-center text-muted-2 py-4">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('activity-log');
      var LOGS = [];

      App.data('activity-log.json').done(function (d) {
        LOGS = d.logs || [];
        fillFilter('#fDept', 'department'); fillFilter('#fModule', 'module'); fillFilter('#fAction', 'action');
        renderKpis(); render();
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });

      function fillFilter(sel, key) {
        var vals = [...new Set(LOGS.map(l => l[key]))].sort();
        $(sel).append(vals.map(v => '<option>' + v + '</option>').join(''));
      }

      function renderKpis() {
        var depts = new Set(LOGS.map(l => l.department)).size;
        var users = new Set(LOGS.map(l => l.user)).size;
        var locks = LOGS.filter(l => l.action === 'Lock' || l.action === 'Block').length;
        var cards = [
          { l: 'Log Entries', v: LOGS.length, t: 'gold', i: 'bx-history' },
          { l: 'Departments', v: depts, t: 'blue', i: 'bx-been-here' },
          { l: 'Users', v: users, t: 'green', i: 'bx-user' },
          { l: 'Locks / Blocks', v: locks, t: 'red', i: 'bx-lock-alt' }
        ];
        $('#kpis').html(cards.map(c => '<div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon ' + c.t + '"><i class="bx ' + c.i + '"></i></div><div><div class="kpi-label">' + c.l + '</div><div class="kpi-value">' + c.v + '</div></div></div></div>').join(''));
      }

      function actionPill(a) {
        var cls = 'a-' + a.toLowerCase();
        return '<span class="act-pill ' + cls + '">' + a + '</span>';
      }

      function render() {
        var dept = $('#fDept').val(), mod = $('#fModule').val(), act = $('#fAction').val(), q = ($('#fSearch').val() || '').toLowerCase();
        var list = LOGS.filter(function (l) {
          if (dept && l.department !== dept) return false;
          if (mod && l.module !== mod) return false;
          if (act && l.action !== act) return false;
          if (q && !((l.user + ' ' + l.document + ' ' + l.detail).toLowerCase().includes(q))) return false;
          return true;
        });
        $('#logTitle').text('Audit Trail — ' + list.length + ' entr' + (list.length === 1 ? 'y' : 'ies'));
        $('#rows').html(list.length ? list.map(function (l) {
          return '<tr>' +
            '<td class="text-muted-2 small" style="white-space:nowrap">' + l.time + '</td>' +
            '<td><span class="fw-bold" style="color:var(--ink-900)">' + l.user + '</span><div class="card-sub">' + (l.role || '') + '</div></td>' +
            '<td><span class="badge-soft badge-draft">' + l.department + '</span></td>' +
            '<td>' + l.module + '</td>' +
            '<td>' + actionPill(l.action) + '</td>' +
            '<td><span class="fw-bold text-gold">' + l.document + '</span></td>' +
            '<td class="text-muted-2 small">' + l.detail + '</td>' +
          '</tr>';
        }).join('') : '<tr><td colspan="7" class="text-center text-muted-2 py-4">No matching activity</td></tr>');
      }
      $('#fDept,#fModule,#fAction').on('change', render);
      $('#fSearch').on('input', render);
    });
  </script>
</body>
</html>
