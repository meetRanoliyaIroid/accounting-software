<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trial Balance · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Trial Balance</h1>
            <div class="crumb">Reports · <b>Trial Balance</b></div>
          </div>
          <div class="head-actions">
            <select class="form-select form-select-sm" style="width:auto"><option>FY 2026-2027</option></select>
            <button class="btn btn-soft" onclick="App.print.report('Trial Balance','As on 24 Jun 2026 · FY 2026-2027', document.querySelector('.report-table').outerHTML)"><i class="bx bx-printer"></i> Print</button>
          </div>
        </div>

        <div class="card card-pad mb-3" data-aos="fade-up">
          <div class="d-flex flex-wrap gap-3 align-items-center">
            <div><div class="kpi-label">As On Date</div><div class="fw-bold" style="color:var(--ink-900)">24 Jun 2026</div></div>
            <div class="vr d-none d-md-block"></div>
            <div><div class="kpi-label">Total Debit</div><div class="fw-8 text-gold" id="hDr">₹0</div></div>
            <div class="vr d-none d-md-block"></div>
            <div><div class="kpi-label">Total Credit</div><div class="fw-8 text-gold" id="hCr">₹0</div></div>
            <div class="ms-auto"><span class="balance-pill ok" id="tbStatus" style="padding:.5rem 1rem;border-radius:999px;font-weight:700"><i class="bx bx-check-circle"></i> Balanced</span></div>
          </div>
        </div>

        <div class="card" data-aos="fade-up">
          <div class="card-pad"><h5 class="card-title">Trial Balance — All Ledger Accounts</h5><div class="card-sub">Closing balances grouped by root type</div></div>
          <div class="table-wrap">
            <table class="report-table">
              <thead><tr><th>Account</th><th>Type</th><th class="num">Debit</th><th class="num">Credit</th></tr></thead>
              <tbody id="tbRows"><tr><td colspan="4" class="text-center text-muted-2 py-4">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/print.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('trial-balance');
      var CUR = '₹';
      var DEBIT_ROOTS = ['Asset', 'Expense'];

      App.data('accounts.json').done(function (d) {
        CUR = d.currency;
        var ledgers = d.accounts.filter(a => !a.is_group);
        var order = ['Asset', 'Liability', 'Equity', 'Income', 'Expense'];
        var html = '', totDr = 0, totCr = 0;
        order.forEach(function (root) {
          var group = ledgers.filter(a => a.root_type === root);
          if (!group.length) return;
          html += '<tr class="grp"><td colspan="4">' + root + '</td></tr>';
          group.forEach(function (a) {
            var isDr = DEBIT_ROOTS.includes(a.root_type);
            var dr = isDr ? a.balance : 0, cr = isDr ? 0 : a.balance;
            totDr += dr; totCr += cr;
            html += '<tr class="indent drill" style="cursor:pointer" data-acct="' + a.code + ' · ' + a.name + '" title="View ledger">' +
              '<td><span class="acct-link">' + a.code + ' · ' + a.name + '</span></td>' +
              '<td><span class="badge-soft badge-draft">' + (a.account_type || root) + '</span></td>' +
              '<td class="num tabular">' + (dr ? App.number(dr) : '—') + '</td>' +
              '<td class="num tabular">' + (cr ? App.number(cr) : '—') + '</td>' +
            '</tr>';
          });
        });
        html += '<tr class="total"><td colspan="2" class="text-end">TOTAL</td><td class="num tabular">' + App.number(totDr) + '</td><td class="num tabular">' + App.number(totCr) + '</td></tr>';
        $('#tbRows').html(html);
        $(document).on('click', '.drill', function () { location.href = 'general-ledger.html?account=' + encodeURIComponent($(this).data('acct')); });
        $('#hDr').text(App.currency(totDr, CUR));
        $('#hCr').text(App.currency(totCr, CUR));
        var diff = +(totDr - totCr).toFixed(2);
        if (diff !== 0) $('#tbStatus').removeClass('ok').addClass('bad').css({ background: 'var(--danger-soft)', color: 'var(--danger)' }).html('<i class="bx bx-error-circle"></i> Difference ' + App.currency(diff, CUR));
        else $('#tbStatus').css({ background: 'var(--success-soft)', color: 'var(--success)' });
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });
    });
  </script>
</body>
</html>
