<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Stock Ledger · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <style>
    .ln td { padding: .4rem .5rem; }
    .ln .form-control, .ln .form-select { padding: .4rem .6rem; font-size: .84rem; }
    .gl-preview { background: var(--gold-50); border:1px dashed var(--gold-300); border-radius: var(--radius); }
    .tot-line { display:flex; justify-content:space-between; padding:.35rem 0; }
    .tot-line.grand { border-top:2px solid var(--line); margin-top:.3rem; padding-top:.6rem; font-size:1.15rem; font-weight:800; color:var(--ink-900); }
    .stk-pill { font-size:.7rem; font-weight:700; padding:.18rem .55rem; border-radius:999px; }
    .stk-in { background:var(--success-soft); color:var(--success); }
    .stk-low { background:var(--warning-soft); color:var(--warning); }
    .stk-out { background:var(--danger-soft); color:var(--danger); }
    .mv-in { color:var(--success); font-weight:700; }
    .mv-out { color:var(--danger); font-weight:700; }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Stock Ledger</h1>
            <div class="crumb">Inventory · <b>Stock Ledger</b></div>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft d-none" id="btnBack"><i class="bx bx-arrow-back"></i> Back to List</button>
            <button class="btn btn-gold" id="btnNew"><i class="bx bx-plus"></i> New Stock Entry</button>
          </div>
        </div>

        <!-- LIST -->
        <div id="listView">
          <div class="row g-3 mb-3" data-aos="fade-up">
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon gold"><i class="bx bx-rupee"></i></div><div><div class="kpi-label">Total Stock Value</div><div class="kpi-value" id="stValue">₹0</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon blue"><i class="bx bx-box"></i></div><div><div class="kpi-label">Stock Items</div><div class="kpi-value" id="stItems">0</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon red"><i class="bx bx-error-circle"></i></div><div><div class="kpi-label">Low Stock</div><div class="kpi-value" id="stLow">0</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon green"><i class="bx bx-store-alt"></i></div><div><div class="kpi-label">Warehouses</div><div class="kpi-value" id="stWh">0</div></div></div></div>
          </div>
          <div class="card" data-aos="fade-up">
            <div class="card-pad d-flex flex-wrap align-items-center gap-2">
              <h5 class="card-title me-auto">Stock Balances</h5>
              <select class="form-select form-select-sm" id="fltWh" style="width:auto"><option value="">All Warehouses</option></select>
              <select class="form-select form-select-sm" id="fltGroup" style="width:auto"><option value="">All Groups</option></select>
              <div style="max-width:240px;width:100%"><input id="search" class="form-control form-control-sm" placeholder="Search item name or code…"></div>
            </div>
            <div class="table-wrap">
              <table class="tbl">
                <thead><tr><th>Item</th><th>Group</th><th>UoM</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th><th class="num">Val. Rate</th><th class="num">Stock Value</th><th>Status</th><th></th></tr></thead>
                <tbody id="rows"><tr><td colspan="10" class="text-center text-muted-2 py-4">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- DETAIL -->
        <div id="detailView" class="d-none"></div>

        <!-- FORM -->
        <div id="formView" class="d-none">
          <div class="row g-3">
            <div class="col-lg-8">
              <div class="card card-pad mb-3" data-aos="fade-up">
                <div class="row g-3">
                  <div class="col-md-3"><label class="form-label">Entry No.</label><input class="form-control" id="enNo" readonly></div>
                  <div class="col-md-3"><label class="form-label">Date</label><input class="form-control" type="date" id="enDate"></div>
                  <div class="col-md-6"><label class="form-label">Entry Type *</label>
                    <select class="form-select" id="enType">
                      <option>Material Receipt</option>
                      <option>Material Issue</option>
                      <option>Stock Transfer</option>
                      <option>Stock Adjustment</option>
                    </select>
                  </div>
                  <div class="col-md-6"><label class="form-label" id="whLabel">Warehouse *</label><select class="form-select" id="enWh"></select></div>
                  <div class="col-md-6" id="toWhWrap" style="display:none"><label class="form-label">Target Warehouse *</label><select class="form-select" id="enToWh"></select></div>
                  <div class="col-md-12"><label class="form-label">Reference / Remark</label><input class="form-control" id="enRef" placeholder="e.g. Issue to Production · WO-2026-0006"></div>
                </div>
              </div>
              <div class="card" data-aos="fade-up">
                <div class="card-pad d-flex align-items-center"><h5 class="card-title me-auto">Items</h5><button class="btn btn-outline-gold btn-sm" id="addLine"><i class="bx bx-plus"></i> Add Item</button></div>
                <div class="table-wrap">
                  <table class="tbl ln">
                    <thead><tr><th style="width:40%">Item</th><th class="num">Qty</th><th class="num">Val. Rate</th><th class="num">Value</th><th></th></tr></thead>
                    <tbody id="lnRows"></tbody>
                  </table>
                </div>
              </div>
            </div>
            <div class="col-lg-4">
              <div class="card card-pad mb-3" data-aos="fade-up">
                <h5 class="card-title mb-3">Summary</h5>
                <div class="tot-line"><span class="text-muted-2">Total Qty</span><span class="tabular fw-bold" id="sQty">0</span></div>
                <div class="tot-line grand"><span>Stock Value</span><span class="tabular text-gold" id="sVal">₹0.00</span></div>
                <div class="d-grid gap-2 mt-3">
                  <button class="btn btn-gold" id="submitEntry"><i class="bx bx-check-double"></i> Submit Entry</button>
                </div>
              </div>
              <div class="card card-pad gl-preview" data-aos="fade-up">
                <h6 class="fw-8 mb-2"><i class="bx bx-transfer-alt text-gold"></i> GL Posting Preview</h6>
                <div class="card-sub mb-2" id="glHint">Inventory movements post to the ledger:</div>
                <table class="tbl" style="background:transparent"><tbody id="glRows"></tbody></table>
              </div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('stock');
      var CUR = '₹', WH = [], ITEMS = [], MOVES = [], ENTRIES = [], seq = 12;

      App.data('stock.json').done(function (d) {
        CUR = d.currency; WH = d.warehouses; ITEMS = d.items; MOVES = d.movements; ENTRIES = d.entries || [];
        $('#fltWh').append(WH.map(w => '<option value="' + w.code + '">' + w.name + '</option>').join(''));
        var groups = [...new Set(ITEMS.map(i => i.group))];
        $('#fltGroup').append(groups.map(g => '<option>' + g + '</option>').join(''));
        renderStats(); render();
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });

      // ---- balance helpers (derived from movements so everything ties out) ----
      function movesFor(itemId, wh) {
        return MOVES.filter(m => m.item_id === itemId && (!wh || m.warehouse === wh));
      }
      function balanceOf(itemId, wh) {
        return movesFor(itemId, wh).reduce(function (acc, m) {
          acc.in += m.in; acc.out += m.out; return acc;
        }, { in: 0, out: 0 });
      }
      function itemRow(it) {
        var wh = $('#fltWh').val();
        var b = balanceOf(it.item_id, wh);
        var bal = b.in - b.out;
        return { it: it, in: b.in, out: b.out, bal: bal, value: bal * it.rate,
          status: bal <= 0 ? 'Out of Stock' : (bal < it.reorder ? 'Low Stock' : 'In Stock') };
      }

      function renderStats() {
        var rows = ITEMS.map(itemRow);
        var totVal = rows.reduce((s, r) => s + r.value, 0);
        App.countUp($('#stValue'), totVal, { prefix: CUR, decimals: 0 });
        $('#stItems').text(ITEMS.length);
        $('#stLow').text(rows.filter(r => r.status !== 'In Stock').length);
        $('#stWh').text(WH.length);
      }

      function statusPill(s) {
        var cls = s === 'In Stock' ? 'stk-in' : (s === 'Low Stock' ? 'stk-low' : 'stk-out');
        return '<span class="stk-pill ' + cls + '">' + s + '</span>';
      }

      function render() {
        var q = ($('#search').val() || '').toLowerCase(), g = $('#fltGroup').val();
        var list = ITEMS.filter(i => (!g || i.group === g) && (i.name.toLowerCase().includes(q) || i.code.toLowerCase().includes(q))).map(itemRow);
        if (!list.length) { $('#rows').html('<tr><td colspan="10" class="text-center text-muted-2 py-4">No items found</td></tr>'); return; }
        $('#rows').html(list.map(function (r) {
          return '<tr class="row-click" style="cursor:pointer" data-id="' + r.it.item_id + '" title="View movement ledger">' +
            '<td><span class="fw-bold text-gold">' + r.it.code + '</span><div class="card-sub">' + r.it.name + '</div></td>' +
            '<td>' + r.it.group + '</td>' +
            '<td class="text-muted-2">' + r.it.uom + '</td>' +
            '<td class="num tabular mv-in">' + App.number(r.in) + '</td>' +
            '<td class="num tabular mv-out">' + App.number(r.out) + '</td>' +
            '<td class="num tabular fw-bold">' + App.number(r.bal) + '</td>' +
            '<td class="num tabular text-muted-2">' + App.currency(r.it.rate, CUR) + '</td>' +
            '<td class="num tabular fw-bold">' + App.currency(r.value, CUR) + '</td>' +
            '<td>' + statusPill(r.status) + '</td>' +
            '<td class="text-end">' + App.kebab(r.it.item_id, [
              { act: 'view', icon: 'bx-history', label: 'Movement Ledger' },
              { act: 'k-issue', icon: 'bx-up-arrow-alt', label: 'Issue Stock' },
              { act: 'k-receipt', icon: 'bx-down-arrow-alt', label: 'Receive Stock' }
            ]) + '</td>' +
          '</tr>';
        }).join(''));
      }
      $('#search, #fltWh, #fltGroup').on('input change', function () { renderStats(); render(); });

      // ---- Detail: movement ledger for one item ----
      $(document).on('click', '.row-click', function (e) {
        if ($(e.target).closest('.dropdown').length) return;
        showDetail($(this).data('id'));
      });
      $(document).on('click', '[data-act="view"]', function () { showDetail($(this).data('id')); });
      $(document).on('click', '[data-act="k-issue"]', function () { showForm('Material Issue', $(this).data('id')); });
      $(document).on('click', '[data-act="k-receipt"]', function () { showForm('Material Receipt', $(this).data('id')); });

      function whName(code) { var w = WH.find(x => x.code === code); return w ? w.name : code; }

      function showDetail(itemId) {
        var it = ITEMS.find(x => x.item_id == itemId); if (!it) return;
        $('#listView,#formView').addClass('d-none'); $('#detailView').removeClass('d-none');
        $('#btnBack').removeClass('d-none'); $('#btnNew').addClass('d-none');
        var rows = movesFor(it.item_id).slice().sort((a, b) => new Date(a.date) - new Date(b.date));
        var run = 0;
        var body = rows.map(function (m) {
          run += m.in - m.out;
          return '<tr><td class="text-muted-2">' + App.shortDate(m.date) + '</td>' +
            '<td><span class="fw-bold text-gold">' + m.voucher + '</span></td>' +
            '<td><span class="badge-soft" style="background:var(--bg-soft);color:var(--ink-700)">' + m.type + '</span></td>' +
            '<td>' + whName(m.warehouse) + '</td>' +
            '<td class="num tabular mv-in">' + (m.in ? App.number(m.in) : '—') + '</td>' +
            '<td class="num tabular mv-out">' + (m.out ? App.number(m.out) : '—') + '</td>' +
            '<td class="num tabular fw-bold">' + App.number(run) + '</td>' +
            '<td class="card-sub">' + (m.ref || '') + '</td></tr>';
        }).join('') || '<tr><td colspan="8" class="text-center text-muted-2 py-3">No movements</td></tr>';
        var r = itemRow(it);
        var html =
          '<div class="card card-pad mb-3" data-aos="fade-up">' +
            '<div class="d-flex flex-wrap align-items-start gap-3">' +
              '<div><div class="kpi-label">Item</div><h2 class="fw-8 mb-0 text-gold">' + it.code + '</h2><div class="card-sub mt-1">' + it.name + ' · ' + it.group + ' · ' + it.uom + '</div></div>' +
              '<div class="ms-auto text-end">' + statusPill(r.status) +
                '<div class="mt-2"><div class="kpi-label">Current Balance</div><div class="fw-8 text-gold" style="font-size:1.6rem">' + App.number(r.bal) + ' ' + it.uom + '</div></div></div>' +
            '</div>' +
            '<div class="divider"></div>' +
            '<div class="row g-3">' +
              '<div class="col-md-3"><div class="kpi-label">Total In</div><div class="fw-bold mv-in">' + App.number(r.in) + '</div></div>' +
              '<div class="col-md-3"><div class="kpi-label">Total Out</div><div class="fw-bold mv-out">' + App.number(r.out) + '</div></div>' +
              '<div class="col-md-3"><div class="kpi-label">Valuation Rate</div><div class="fw-bold">' + App.currency(it.rate, CUR) + '</div></div>' +
              '<div class="col-md-3"><div class="kpi-label">Stock Value</div><div class="fw-bold text-gold">' + App.currency(r.value, CUR) + '</div></div>' +
            '</div>' +
          '</div>' +
          '<div class="card" data-aos="fade-up"><div class="card-pad d-flex align-items-center"><h5 class="card-title me-auto">Movement Ledger</h5>' +
            '<button class="btn btn-outline-gold btn-sm" onclick="window.print()"><i class="bx bx-printer"></i> Print</button></div>' +
            '<div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Voucher</th><th>Type</th><th>Warehouse</th><th class="num">In</th><th class="num">Out</th><th class="num">Balance</th><th>Reference</th></tr></thead><tbody>' + body + '</tbody></table></div></div>';
        $('#detailView').html(html);
      }

      // ---- Form: new stock entry ----
      function itemOptions() { return '<option value="">Select item…</option>' + ITEMS.map(i => '<option value="' + i.item_id + '">' + i.code + ' · ' + i.name + '</option>').join(''); }
      function whOptions() { return WH.map(w => '<option value="' + w.code + '">' + w.name + '</option>').join(''); }

      function addLine(itemId) {
        var $tr = $('<tr>' +
          '<td><select class="form-select li-item">' + itemOptions() + '</select></td>' +
          '<td><input class="form-control num li-qty text-end" value="1"></td>' +
          '<td><input class="form-control num li-rate text-end" value="0"></td>' +
          '<td class="num tabular li-val fw-bold">0.00</td>' +
          '<td class="text-center"><button class="icon-btn li-del" style="width:30px;height:30px;font-size:1rem;color:var(--danger)"><i class="bx bx-trash"></i></button></td>' +
        '</tr>');
        $('#lnRows').append($tr);
        if (itemId) { $tr.find('.li-item').val(itemId).trigger('change'); }
      }

      $(document).on('change', '.li-item', function () {
        var it = ITEMS.find(x => x.item_id == $(this).val());
        if (it) $(this).closest('tr').find('.li-rate').val(it.rate);
        recalc();
      });
      $(document).on('input', '.li-qty, .li-rate', recalc);
      $(document).on('click', '.li-del', function () { $(this).closest('tr').remove(); recalc(); });
      $('#addLine').on('click', function () { addLine(); });

      $('#enType').on('change', function () {
        var t = $(this).val();
        $('#toWhWrap').toggle(t === 'Stock Transfer');
        $('#whLabel').text(t === 'Stock Transfer' ? 'Source Warehouse *' : 'Warehouse *');
        recalc();
      });

      function recalc() {
        var qty = 0, val = 0;
        $('#lnRows tr').each(function () {
          var q = parseFloat($(this).find('.li-qty').val()) || 0;
          var r = parseFloat($(this).find('.li-rate').val()) || 0;
          $(this).find('.li-val').text(App.number(q * r));
          qty += q; val += q * r;
        });
        $('#sQty').text(App.number(qty));
        $('#sVal').text(App.currency(val, CUR));
        // GL preview by entry type
        var t = $('#enType').val(), gl = [];
        if (t === 'Material Receipt') { gl = [{ a: '1400 · Inventory', d: val, c: 0 }, { a: '5100 · Cost of Goods Sold', d: 0, c: val }]; $('#glHint').text('Receipt increases inventory:'); }
        else if (t === 'Material Issue') { gl = [{ a: '5100 · Cost / Consumption', d: val, c: 0 }, { a: '1400 · Inventory', d: 0, c: val }]; $('#glHint').text('Issue consumes inventory:'); }
        else if (t === 'Stock Transfer') { gl = [{ a: '1400 · Inventory (' + ($('#enToWh').val() || 'Target') + ')', d: val, c: 0 }, { a: '1400 · Inventory (' + ($('#enWh').val() || 'Source') + ')', d: 0, c: val }]; $('#glHint').text('Transfer moves value between locations:'); }
        else { gl = [{ a: '1400 · Inventory', d: val, c: 0 }, { a: '5900 · Stock Adjustment', d: 0, c: val }]; $('#glHint').text('Adjustment revalues inventory:'); }
        $('#glRows').html(gl.map(g => '<tr><td class="small">' + g.a + '</td><td class="num tabular small">' + (g.d ? App.number(g.d) : '—') + '</td><td class="num tabular small">' + (g.c ? App.number(g.c) : '—') + '</td></tr>').join(''));
        return { qty: qty, val: val };
      }

      function showForm(presetType, presetItem) {
        $('#listView,#detailView').addClass('d-none'); $('#formView').removeClass('d-none');
        $('#btnBack').removeClass('d-none'); $('#btnNew').addClass('d-none');
        $('#enNo').val('STK-2026-' + String(seq).padStart(4, '0'));
        $('#enDate').val('2026-06-24');
        $('#enType').val(presetType || 'Material Receipt').trigger('change');
        $('#enWh').html(whOptions()); $('#enToWh').html(whOptions());
        $('#enRef').val('');
        $('#lnRows').empty(); addLine(presetItem); recalc();
      }
      function showList() {
        $('#formView,#detailView').addClass('d-none'); $('#listView').removeClass('d-none');
        $('#btnBack').addClass('d-none'); $('#btnNew').removeClass('d-none');
      }
      $('#btnNew').on('click', function () { showForm(); });
      $('#btnBack').on('click', showList);

      $('#submitEntry').on('click', function () {
        var type = $('#enType').val(), wh = $('#enWh').val(), toWh = $('#enToWh').val();
        var lines = [];
        $('#lnRows tr').each(function () {
          var id = parseInt($(this).find('.li-item').val(), 10);
          var q = parseFloat($(this).find('.li-qty').val()) || 0;
          var r = parseFloat($(this).find('.li-rate').val()) || 0;
          if (id && q > 0) lines.push({ item_id: id, qty: q, rate: r });
        });
        if (!lines.length) { App.toast('Add at least one item with quantity', 'error'); return; }
        if (type === 'Stock Transfer' && (!toWh || toWh === wh)) { App.toast('Choose a different target warehouse', 'error'); return; }
        var no = $('#enNo').val(), date = $('#enDate').val(), ref = $('#enRef').val();
        var mid = Math.max.apply(null, MOVES.map(m => m.id)) ;
        lines.forEach(function (l) {
          if (type === 'Material Receipt') MOVES.push({ id: ++mid, item_id: l.item_id, date: date, voucher: no, type: 'Receipt', warehouse: wh, in: l.qty, out: 0, rate: l.rate, ref: ref });
          else if (type === 'Material Issue') MOVES.push({ id: ++mid, item_id: l.item_id, date: date, voucher: no, type: 'Issue', warehouse: wh, in: 0, out: l.qty, rate: l.rate, ref: ref });
          else if (type === 'Stock Adjustment') MOVES.push({ id: ++mid, item_id: l.item_id, date: date, voucher: no, type: 'Adjustment', warehouse: wh, in: l.qty >= 0 ? l.qty : 0, out: l.qty < 0 ? -l.qty : 0, rate: l.rate, ref: ref });
          else if (type === 'Stock Transfer') {
            MOVES.push({ id: ++mid, item_id: l.item_id, date: date, voucher: no, type: 'Transfer Out', warehouse: wh, in: 0, out: l.qty, rate: l.rate, ref: 'To ' + whName(toWh) + (ref ? ' · ' + ref : '') });
            MOVES.push({ id: ++mid, item_id: l.item_id, date: date, voucher: no, type: 'Transfer In', warehouse: toWh, in: l.qty, out: 0, rate: l.rate, ref: 'From ' + whName(wh) + (ref ? ' · ' + ref : '') });
          }
        });
        ENTRIES.unshift({ id: Date.now(), no: no, date: date, type: type, warehouse: wh, to_warehouse: toWh || '', ref: ref, status: 'Submitted', lines: lines });
        seq++;
        App.toast('Stock entry ' + no + ' submitted — ledger updated (demo)');
        renderStats(); render(); showList();
      });
    });
  </script>
</body>
</html>
