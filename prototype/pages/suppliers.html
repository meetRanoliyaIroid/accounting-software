<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Suppliers · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Suppliers</h1>
            <div class="crumb">Purchases · <b>Suppliers</b></div>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft d-none" id="btnBack"><i class="bx bx-arrow-back"></i> Back to List</button>
            <button class="btn btn-soft"><i class="bx bx-export"></i> Export</button>
            <button class="btn btn-gold" id="btnNew"><i class="bx bx-plus"></i> New Supplier</button>
          </div>
        </div>

        <div id="detailView" class="d-none"></div>
        <div id="listView">
        <div class="row g-3 mb-3" data-aos="fade-up">
          <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon blue"><i class="bx bx-store"></i></div><div><div class="kpi-label">Total Suppliers</div><div class="kpi-value" id="stTotal">0</div></div></div></div>
          <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon green"><i class="bx bx-check-shield"></i></div><div><div class="kpi-label">Active</div><div class="kpi-value" id="stActive">0</div></div></div></div>
          <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon red"><i class="bx bx-rupee"></i></div><div><div class="kpi-label">Total Payable</div><div class="kpi-value" id="stPayable">₹0</div></div></div></div>
          <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon gold"><i class="bx bx-time-five"></i></div><div><div class="kpi-label">With Outstanding</div><div class="kpi-value" id="stOutstanding">0</div></div></div></div>
        </div>

        <div class="card" data-aos="fade-up">
          <div class="card-pad d-flex flex-wrap align-items-center gap-2">
            <h5 class="card-title me-auto">Supplier List</h5>
            <select class="form-select form-select-sm" id="fltStatus" style="width:auto"><option value="">All Status</option><option>Active</option><option>Inactive</option></select>
            <div style="max-width:260px;width:100%"><input id="search" class="form-control form-control-sm" placeholder="Search name, code, city…"></div>
          </div>
          <div class="table-wrap">
            <table class="tbl">
              <thead><tr><th>Supplier</th><th>GSTIN</th><th>City</th><th>Terms</th><th class="num">Balance Payable</th><th>Status</th><th></th></tr></thead>
              <tbody id="rows"><tr><td colspan="7" class="text-center text-muted-2 py-4">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
        </div><!-- /listView -->
      </main>
    </div>
  </div>

  <div class="modal fade" id="suppModal" tabindex="-1">
    <div class="modal-dialog modal-lg modal-dialog-centered">
      <div class="modal-content" style="border-radius:var(--radius);border:none">
        <div class="modal-header" style="border-bottom:1px solid var(--line)">
          <h5 class="modal-title fw-8" id="modalTitle">New Supplier</h5>
          <button class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body">
          <input type="hidden" id="fId">
          <div class="row g-3">
            <div class="col-md-6"><label class="form-label">Supplier Name *</label><input class="form-control" id="fName"></div>
            <div class="col-md-6"><label class="form-label">GSTIN / Tax ID</label><input class="form-control" id="fTax"></div>
            <div class="col-md-6"><label class="form-label">Email</label><input class="form-control" id="fEmail" type="email"></div>
            <div class="col-md-6"><label class="form-label">Phone</label><input class="form-control" id="fPhone"></div>
            <div class="col-md-6"><label class="form-label">City</label><input class="form-control" id="fCity"></div>
            <div class="col-md-6"><label class="form-label">Payment Terms</label><select class="form-select" id="fTerms"><option>Net 15</option><option>Net 30</option><option>Net 45</option><option>Due on Receipt</option></select></div>
            <div class="col-md-6"><label class="form-label">Payable Account</label><select class="form-select" id="fAcct"><option>2110 · Accounts Payable</option></select></div>
            <div class="col-md-6"><label class="form-label">Opening Balance</label><input class="form-control" id="fBal" value="0"></div>
            <div class="col-md-6"><label class="form-label">Status</label><select class="form-select" id="fStatus"><option>Active</option><option>Inactive</option></select></div>
          </div>
        </div>
        <div class="modal-footer" style="border-top:1px solid var(--line)">
          <button class="btn btn-soft" data-bs-dismiss="modal">Cancel</button>
          <button class="btn btn-gold" id="save"><i class="bx bx-check"></i> Save Supplier</button>
        </div>
      </div>
    </div>
  </div>

  <div class="offcanvas offcanvas-end" tabindex="-1" id="stmt" style="width:480px">
    <div class="offcanvas-header" style="border-bottom:1px solid var(--line)">
      <div><h5 class="fw-8 mb-0" id="stmtName"></h5><div class="card-sub" id="stmtMeta"></div></div>
      <button class="btn-close" data-bs-dismiss="offcanvas"></button>
    </div>
    <div class="offcanvas-body">
      <div class="card card-pad mb-3 bg-soft border-0">
        <div class="d-flex justify-content-between"><span class="text-muted-2">Outstanding Payable</span><span class="fw-8 text-gold" id="stmtBal" style="font-size:1.2rem"></span></div>
      </div>
      <h6 class="fw-8 text-uppercase text-muted-2" style="font-size:.72rem;letter-spacing:.05em">Statement of Account</h6>
      <div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Voucher</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody id="stmtRows"></tbody></table></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('suppliers');
      var DATA = [], CUR = '₹';
      var modal = new bootstrap.Modal('#suppModal');
      var stmt = new bootstrap.Offcanvas('#stmt');

      App.data('suppliers.json').done(function (d) {
        DATA = d.suppliers; CUR = d.currency;
        renderStats(); render();
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });

      function renderStats() {
        $('#stTotal').text(DATA.length);
        $('#stActive').text(DATA.filter(c => c.status === 'Active').length);
        App.countUp($('#stPayable'), DATA.reduce((s, c) => s + c.balance, 0), { prefix: CUR, decimals: 0 });
        $('#stOutstanding').text(DATA.filter(c => c.balance > 0).length);
      }

      function statusBadge(s) { return '<span class="badge-soft ' + (s === 'Active' ? 'badge-paid' : 'badge-draft') + '">' + s + '</span>'; }

      function render() {
        var q = $('#search').val().toLowerCase(), st = $('#fltStatus').val();
        var list = DATA.filter(c => (!st || c.status === st) &&
          (c.name.toLowerCase().includes(q) || c.code.toLowerCase().includes(q) || c.city.toLowerCase().includes(q)));
        if (!list.length) { $('#rows').html('<tr><td colspan="7" class="text-center text-muted-2 py-4">No suppliers found</td></tr>'); return; }
        $('#rows').html(list.map(function (c) {
          var initials = c.name.split(' ').map(w => w[0]).slice(0, 2).join('');
          return '<tr>' +
            '<td><div class="d-flex align-items-center"><span class="avatar-sm">' + initials + '</span><div><div class="fw-bold detail-link" data-id="' + c.id + '" style="color:var(--ink-900);cursor:pointer" title="View profile">' + c.name + '</div><div class="card-sub">' + c.code + ' · ' + c.email + '</div></div></div></td>' +
            '<td class="text-muted-2 small">' + c.tax_id + '</td>' +
            '<td>' + c.city + '</td>' +
            '<td><span class="badge-soft badge-draft">' + c.payment_terms + '</span></td>' +
            '<td class="num tabular fw-bold ' + (c.balance > 0 ? 'text-gold' : 'text-muted-2') + '">' + App.currency(c.balance, CUR) + '</td>' +
            '<td>' + statusBadge(c.status) + '</td>' +
            '<td class="text-end">' + App.kebab(c.id, [
              { act: 'profile', icon: 'bx-store', label: 'View Profile' },
              { act: 'view', icon: 'bx-receipt', label: 'Statement' },
              { act: 'edit', icon: 'bx-edit', label: 'Edit' },
              { act: 'newbill', icon: 'bx-plus-circle', label: 'New Bill' },
              { act: 'del', icon: 'bx-trash', label: 'Delete', danger: true }
            ]) + '</td>' +
          '</tr>';
        }).join(''));
      }

      $('#search, #fltStatus').on('input change', render);

      // ---- Detail view ----
      $(document).on('click', '.detail-link', function () {
        var c = DATA.find(x => x.id == $(this).data('id'));
        if (c) showDetail(c);
      });
      $('#btnBack').on('click', showList);
      function showList() { $('#detailView').addClass('d-none'); $('#listView').removeClass('d-none'); $('#btnBack').addClass('d-none'); }
      $(document).on('click', '[data-act="profile"]', function () { var c = DATA.find(x => x.id == $(this).data('id')); if (c) showDetail(c); });
      $(document).on('click', '[data-act="newbill"]', function () { window.location.href = 'purchase-invoice.html'; });
      $(document).on('click', '[data-act="del"]', function () {
        var c = DATA.find(x => x.id == $(this).data('id')); if (!c) return;
        App.confirm({ title: 'Delete supplier?', message: c.name + ' will be removed from the master. Existing transactions are not affected.', confirmText: 'Delete',
          onConfirm: function () { DATA = DATA.filter(x => x.id != c.id); renderStats(); render(); if (!$('#detailView').hasClass('d-none')) showList(); App.toast('Supplier "' + c.name + '" deleted (demo)'); } });
      });
      function showDetail(c) {
        $('#listView').addClass('d-none'); $('#detailView').removeClass('d-none'); $('#btnBack').removeClass('d-none');
        var initials = c.name.split(' ').map(w => w[0]).slice(0, 2).join('');
        var stmt = (c.transactions || []).map(t =>
          '<tr><td class="text-muted-2 small">' + App.shortDate(t.date) + '</td><td><span class="text-gold fw-bold">' + t.voucher + '</span><div class="card-sub">' + t.type + '</div></td>' +
          '<td class="num tabular">' + (t.debit ? App.number(t.debit) : '—') + '</td><td class="num tabular">' + (t.credit ? App.number(t.credit) : '—') + '</td>' +
          '<td class="num tabular fw-bold">' + App.number(t.balance) + '</td></tr>').join('') ||
          '<tr><td colspan="5" class="text-center text-muted-2 py-3">No transactions</td></tr>';
        var html =
          '<div class="card card-pad mb-3" data-aos="fade-up"><div class="d-flex flex-wrap align-items-center gap-3">' +
            '<span class="avatar-sm" style="width:56px;height:56px;font-size:1.2rem">' + initials + '</span>' +
            '<div><h2 class="fw-8 mb-0" style="color:var(--ink-900)">' + c.name + '</h2><div class="card-sub">' + c.code + ' · ' + c.city + ' · ' + statusBadge(c.status) + '</div></div>' +
            '<button class="btn btn-outline-gold ms-auto" data-act="edit" data-id="' + c.id + '"><i class="bx bx-edit"></i> Edit</button>' +
          '</div></div>' +
          '<div class="row g-3 mb-3">' +
            '<div class="col-md-6"><div class="card card-pad"><div class="kpi-label">Outstanding Payable</div><div class="fw-8 text-gold" style="font-size:1.4rem">' + App.currency(c.balance, CUR) + '</div></div></div>' +
            '<div class="col-md-6"><div class="card card-pad"><div class="kpi-label">Payment Terms</div><div class="fw-8" style="color:var(--ink-900);font-size:1.4rem">' + c.payment_terms + '</div></div></div>' +
          '</div>' +
          '<div class="row g-3"><div class="col-lg-5"><div class="card card-pad" data-aos="fade-up"><h5 class="card-title mb-3">Contact &amp; Terms</h5>' +
            '<div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line-soft)"><span class="text-muted-2">GSTIN</span><span class="fw-bold">' + c.tax_id + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line-soft)"><span class="text-muted-2">Email</span><span class="fw-bold">' + c.email + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;padding:.4rem 0;border-bottom:1px solid var(--line-soft)"><span class="text-muted-2">Phone</span><span class="fw-bold">' + c.phone + '</span></div>' +
            '<div style="display:flex;justify-content:space-between;padding:.4rem 0"><span class="text-muted-2">Payable A/c</span><span class="fw-bold">' + c.payable_account + '</span></div>' +
          '</div></div>' +
          '<div class="col-lg-7"><div class="card" data-aos="fade-up"><div class="card-pad"><h5 class="card-title">Statement of Account</h5></div>' +
            '<div class="table-wrap"><table class="tbl"><thead><tr><th>Date</th><th>Voucher</th><th class="num">Debit</th><th class="num">Credit</th><th class="num">Balance</th></tr></thead><tbody>' + stmt + '</tbody></table></div></div></div></div>';
        $('#detailView').html(html);
      }

      $('#btnNew').on('click', function () {
        $('#modalTitle').text('New Supplier');
        $('#fId').val(''); $('#suppModal input').val(''); $('#fBal').val('0'); $('#fStatus').val('Active');
        modal.show();
      });

      $(document).on('click', '[data-act="edit"]', function () {
        var c = DATA.find(x => x.id == $(this).data('id'));
        $('#modalTitle').text('Edit Supplier');
        $('#fId').val(c.id); $('#fName').val(c.name); $('#fTax').val(c.tax_id); $('#fEmail').val(c.email);
        $('#fPhone').val(c.phone); $('#fCity').val(c.city); $('#fTerms').val(c.payment_terms);
        $('#fBal').val(c.balance); $('#fStatus').val(c.status);
        modal.show();
      });

      $(document).on('click', '[data-act="view"]', function () {
        var c = DATA.find(x => x.id == $(this).data('id'));
        $('#stmtName').text(c.name);
        $('#stmtMeta').text(c.code + ' · ' + c.city + ' · ' + c.payment_terms);
        $('#stmtBal').text(App.currency(c.balance, CUR));
        $('#stmtRows').html((c.transactions || []).map(t =>
          '<tr><td class="text-muted-2 small">' + App.shortDate(t.date) + '</td><td><span class="text-gold fw-bold">' + t.voucher + '</span><div class="card-sub">' + t.type + '</div></td>' +
          '<td class="num tabular">' + (t.debit ? App.number(t.debit) : '—') + '</td><td class="num tabular">' + (t.credit ? App.number(t.credit) : '—') + '</td>' +
          '<td class="num tabular fw-bold">' + App.number(t.balance) + '</td></tr>').join('') ||
          '<tr><td colspan="5" class="text-center text-muted-2 py-3">No transactions</td></tr>');
        stmt.show();
      });

      $('#save').on('click', function () {
        var name = $('#fName').val().trim();
        if (!name) { App.toast('Supplier name is required', 'error'); return; }
        var id = $('#fId').val();
        var obj = {
          name: name, tax_id: $('#fTax').val(), email: $('#fEmail').val(), phone: $('#fPhone').val(),
          city: $('#fCity').val(), payment_terms: $('#fTerms').val(), payable_account: '2110 · Accounts Payable',
          balance: parseFloat($('#fBal').val()) || 0, status: $('#fStatus').val(), transactions: []
        };
        if (id) { Object.assign(DATA.find(x => x.id == id), obj); App.toast('Supplier updated'); }
        else { obj.id = Date.now(); obj.code = 'SUPP-' + String(DATA.length + 1).padStart(4, '0'); DATA.push(obj); App.toast('Supplier created (demo — not persisted)'); }
        renderStats(); render(); modal.hide();
      });
    });
  </script>
</body>
</html>
