<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Letters of Credit · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
  <style>
    .tot-line { display:flex; justify-content:space-between; padding:.4rem 0; border-bottom:1px solid var(--line-soft); }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Letters of Credit</h1>
            <div class="crumb">Banking · <b>LC Generator (party-wise)</b></div>
          </div>
          <div class="head-actions">
            <button class="btn btn-soft d-none" id="btnBack"><i class="bx bx-arrow-back"></i> Back to List</button>
            <button class="btn btn-gold" id="btnNew"><i class="bx bx-plus"></i> Generate LC</button>
          </div>
        </div>

        <div id="listView">
          <div class="row g-3 mb-3" data-aos="fade-up">
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon gold"><i class="bx bx-file"></i></div><div><div class="kpi-label">Total LC Value</div><div class="kpi-value" id="stTotal">₹0</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon green"><i class="bx bx-check-circle"></i></div><div><div class="kpi-label">Open LCs</div><div class="kpi-value" id="stOpen">0</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon blue"><i class="bx bx-transfer"></i></div><div><div class="kpi-label">Utilized</div><div class="kpi-value" id="stUtil">₹0</div></div></div></div>
            <div class="col-6 col-xl-3"><div class="card card-hover kpi"><div class="kpi-icon red"><i class="bx bx-time"></i></div><div><div class="kpi-label">Available</div><div class="kpi-value" id="stAvail">₹0</div></div></div></div>
          </div>
          <div class="card" data-aos="fade-up">
            <div class="card-pad d-flex flex-wrap align-items-center gap-2">
              <h5 class="card-title me-auto">LC Register</h5>
              <select class="form-select form-select-sm" id="fltParty" style="width:auto"><option value="">All Parties</option></select>
              <div style="max-width:240px;width:100%"><input id="search" class="form-control form-control-sm" placeholder="Search LC no, goods…"></div>
            </div>
            <div class="table-wrap">
              <table class="tbl">
                <thead><tr><th>LC No.</th><th>Party</th><th>Bank</th><th>Type</th><th class="num">Amount</th><th>Expiry</th><th>Status</th><th></th></tr></thead>
                <tbody id="rows"><tr><td colspan="8" class="text-center text-muted-2 py-4">Loading…</td></tr></tbody>
              </table>
            </div>
          </div>
        </div>

        <div id="detailView" class="d-none"></div>
      </main>
    </div>
  </div>

  <!-- Generate LC modal -->
  <div class="modal fade" id="lcModal" tabindex="-1"><div class="modal-dialog modal-lg modal-dialog-centered"><div class="modal-content" style="border:none;border-radius:var(--radius)">
    <div class="modal-header" style="border-bottom:1px solid var(--line)"><h5 class="modal-title fw-8">Generate Letter of Credit</h5><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body"><div class="row g-3">
      <div class="col-md-4"><label class="form-label">LC No.</label><input class="form-control" id="lNo" readonly></div>
      <div class="col-md-8"><label class="form-label">Party (Supplier / Beneficiary) *</label><select class="form-select" id="lParty"></select></div>
      <div class="col-md-6"><label class="form-label">Issuing Bank</label><select class="form-select" id="lBank"><option>HDFC Bank — Current</option><option>ICICI Bank — Current</option></select></div>
      <div class="col-md-6"><label class="form-label">LC Type</label><select class="form-select" id="lType"><option>Import LC (Sight)</option><option>Import LC (Usance)</option><option>Inland LC</option><option>Export LC</option></select></div>
      <div class="col-md-3"><label class="form-label">Currency</label><select class="form-select" id="lCcy"><option value="INR" data-rate="1">INR</option><option value="USD" data-rate="83.50">USD</option><option value="EUR" data-rate="90.20">EUR</option><option value="AED" data-rate="22.74">AED</option></select></div>
      <div class="col-md-3"><label class="form-label">Amount (FC)</label><input class="form-control num text-end" id="lAmt" value="0"></div>
      <div class="col-md-3"><label class="form-label">Rate</label><input class="form-control num text-end" id="lRate" value="1"></div>
      <div class="col-md-3"><label class="form-label">Value (₹)</label><input class="form-control num text-end" id="lBase" readonly value="0.00"></div>
      <div class="col-md-4"><label class="form-label">Issue Date</label><input class="form-control" type="date" id="lIssue"></div>
      <div class="col-md-4"><label class="form-label">Expiry Date</label><input class="form-control" type="date" id="lExpiry"></div>
      <div class="col-md-4"><label class="form-label">Tenor</label><input class="form-control" id="lTenor" placeholder="e.g. 90 days / Sight"></div>
      <div class="col-12"><label class="form-label">Goods Description</label><input class="form-control" id="lGoods" placeholder="e.g. Raw cotton yarn"></div>
    </div></div>
    <div class="modal-footer" style="border-top:1px solid var(--line)"><button class="btn btn-soft" data-bs-dismiss="modal">Cancel</button><button class="btn btn-gold" id="lSave"><i class="bx bx-check"></i> Generate LC</button></div>
  </div></div></div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/print.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('lc');
      var DATA = [], SUPPLIERS = [], CUR = '₹', seq = 5;
      var lcModal = new bootstrap.Modal('#lcModal');

      $.when(App.data('lc.json'), App.data('suppliers.json')).done(function (lc, su) {
        DATA = lc[0].lcs; CUR = lc[0].currency; SUPPLIERS = su[0].suppliers;
        $('#fltParty').append([...new Set(DATA.map(l => l.party))].map(p => '<option>' + p + '</option>').join(''));
        renderStats(); render();
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });

      function avail(l) { return l.amount - (l.utilized || 0); }
      function renderStats() {
        App.countUp($('#stTotal'), DATA.reduce((s, l) => s + l.amount, 0), { prefix: CUR, decimals: 0 });
        $('#stOpen').text(DATA.filter(l => l.status === 'Open' || l.status === 'Partly Utilized').length);
        App.countUp($('#stUtil'), DATA.reduce((s, l) => s + (l.utilized || 0), 0), { prefix: CUR, decimals: 0 });
        App.countUp($('#stAvail'), DATA.reduce((s, l) => s + avail(l), 0), { prefix: CUR, decimals: 0 });
      }

      function statusBadge(s) {
        var map = { 'Open': 'badge-paid', 'Partly Utilized': 'badge-partial', 'Closed': 'badge-draft', 'Draft': 'badge-draft', 'Expired': 'badge-overdue' };
        return '<span class="badge-soft ' + (map[s] || 'badge-draft') + '">' + s + '</span>';
      }

      function render() {
        var q = ($('#search').val() || '').toLowerCase(), party = $('#fltParty').val();
        var list = DATA.filter(l => (!party || l.party === party) && (l.no.toLowerCase().includes(q) || (l.goods || '').toLowerCase().includes(q)));
        if (!list.length) { $('#rows').html('<tr><td colspan="8" class="text-center text-muted-2 py-4">No LCs</td></tr>'); return; }
        $('#rows').html(list.map(function (l) {
          return '<tr class="row-click" style="cursor:pointer" data-id="' + l.id + '">' +
            '<td><span class="fw-bold text-gold">' + l.no + '</span></td>' +
            '<td>' + l.party + '</td><td class="text-muted-2 small">' + l.bank + '</td><td class="small">' + l.type + '</td>' +
            '<td class="num tabular fw-bold">' + App.currency(l.amount, CUR) + (l.currency !== 'INR' ? '<div class="card-sub">' + l.currency + ' ' + App.number(l.amount_fc) + '</div>' : '') + '</td>' +
            '<td class="text-muted-2">' + App.shortDate(l.expiry_date) + '</td>' +
            '<td>' + statusBadge(l.status) + '</td>' +
            '<td class="text-end">' + App.kebab(l.id, [
              { act: 'view', icon: 'bx-show', label: 'View LC' },
              { act: 'print', icon: 'bx-printer', label: 'Print LC' }
            ]) + '</td></tr>';
        }).join(''));
      }
      $('#search,#fltParty').on('input change', render);

      function byId(el) { return DATA.find(x => x.id == $(el).data('id')); }
      $(document).on('click', '.row-click', function (e) { if ($(e.target).closest('.dropdown').length) return; showDetail(byId(this)); });
      $(document).on('click', '[data-act="view"]', function () { showDetail(byId(this)); });
      $(document).on('click', '[data-act="print"]', function () { printLc(byId(this)); });

      function lcDocHtml(l) {
        return '<table class="report-table"><tbody>' +
          '<tr><td class="fw-8">LC Number</td><td>' + l.no + '</td><td class="fw-8">Type</td><td>' + l.type + '</td></tr>' +
          '<tr><td class="fw-8">Beneficiary</td><td>' + l.party + '</td><td class="fw-8">Issuing Bank</td><td>' + l.bank + '</td></tr>' +
          '<tr><td class="fw-8">Amount</td><td>' + App.currency(l.amount, CUR) + (l.currency !== 'INR' ? ' (' + l.currency + ' ' + App.number(l.amount_fc) + ' @ ' + l.rate + ')' : '') + '</td><td class="fw-8">Tenor</td><td>' + l.tenor + '</td></tr>' +
          '<tr><td class="fw-8">Issue Date</td><td>' + App.shortDate(l.issue_date) + '</td><td class="fw-8">Expiry Date</td><td>' + App.shortDate(l.expiry_date) + '</td></tr>' +
          '<tr><td class="fw-8">Goods</td><td colspan="3">' + l.goods + '</td></tr>' +
          '<tr><td class="fw-8">Linked Invoices</td><td colspan="3">' + ((l.linked_invoices || []).join(', ') || '—') + '</td></tr>' +
          '</tbody></table>';
      }
      function printLc(l) { if (l) App.print.report('Letter of Credit — ' + l.no, l.party + ' · ' + l.bank, lcDocHtml(l)); }

      function showDetail(l) {
        if (!l) return;
        $('#listView').addClass('d-none'); $('#detailView').removeClass('d-none'); $('#btnBack').removeClass('d-none'); $('#btnNew').addClass('d-none');
        var pct = l.amount ? Math.round((l.utilized || 0) / l.amount * 100) : 0;
        var html =
          '<div class="card card-pad mb-3" data-aos="fade-up"><div class="d-flex flex-wrap align-items-start gap-3">' +
            '<div><div class="kpi-label">' + l.type + '</div><h2 class="fw-8 mb-0 text-gold">' + l.no + '</h2><div class="card-sub mt-1">' + l.party + ' · ' + l.bank + '</div></div>' +
            '<div class="ms-auto text-end">' + statusBadge(l.status) + '<div class="mt-2"><div class="kpi-label">LC Value</div><div class="fw-8 text-gold" style="font-size:1.6rem">' + App.currency(l.amount, CUR) + '</div></div></div>' +
          '</div></div>' +
          '<div class="row g-3"><div class="col-lg-7"><div class="card card-pad" data-aos="fade-up"><h5 class="card-title mb-3">LC Terms</h5>' +
            '<div class="tot-line"><span class="text-muted-2">Currency / Rate</span><span class="fw-bold">' + l.currency + (l.currency !== 'INR' ? ' @ ' + l.rate + ' (FC ' + App.number(l.amount_fc) + ')' : '') + '</span></div>' +
            '<div class="tot-line"><span class="text-muted-2">Tenor</span><span class="fw-bold">' + l.tenor + '</span></div>' +
            '<div class="tot-line"><span class="text-muted-2">Issue Date</span><span class="fw-bold">' + App.shortDate(l.issue_date) + '</span></div>' +
            '<div class="tot-line"><span class="text-muted-2">Expiry Date</span><span class="fw-bold">' + App.shortDate(l.expiry_date) + '</span></div>' +
            '<div class="tot-line"><span class="text-muted-2">Goods</span><span class="fw-bold">' + l.goods + '</span></div>' +
            '<div class="tot-line" style="border:0"><span class="text-muted-2">Linked Import Bills</span><span class="fw-bold">' + ((l.linked_invoices || []).join(', ') || '—') + '</span></div>' +
            '<div class="d-flex gap-2 mt-3"><button class="btn btn-gold" onclick="(' + 'function(){})' + '()" id="dPrint"><i class="bx bx-printer"></i> Print LC</button>' +
            '<a class="btn btn-soft" href="payments.html"><i class="bx bx-money"></i> LC Direct Payment</a></div>' +
          '</div></div>' +
          '<div class="col-lg-5"><div class="card card-pad" style="background:var(--gold-50);border:1px dashed var(--gold-300)" data-aos="fade-up"><h6 class="fw-8 mb-2">Utilisation</h6>' +
            '<div class="tot-line"><span class="text-muted-2">LC Value</span><span class="tabular fw-bold">' + App.currency(l.amount, CUR) + '</span></div>' +
            '<div class="tot-line"><span class="text-muted-2">Utilized</span><span class="tabular fw-bold">' + App.currency(l.utilized || 0, CUR) + '</span></div>' +
            '<div class="tot-line" style="border:0"><span class="text-muted-2">Available</span><span class="tabular fw-bold text-gold">' + App.currency(avail(l), CUR) + '</span></div>' +
            '<div class="progress mt-2" style="height:8px;background:#fff"><div class="progress-bar" style="width:' + pct + '%;background:linear-gradient(90deg,var(--gold-400),var(--gold-600))"></div></div>' +
            '<div class="card-sub mt-1">' + pct + '% utilized</div></div></div></div>';
        $('#detailView').html(html);
        $('#dPrint').off('click').on('click', function () { printLc(l); });
      }

      function showList() { $('#detailView').addClass('d-none'); $('#listView').removeClass('d-none'); $('#btnBack').addClass('d-none'); $('#btnNew').removeClass('d-none'); }
      $('#btnBack').on('click', showList);

      function recalcBase() { var amt = parseFloat($('#lAmt').val()) || 0, rate = parseFloat($('#lRate').val()) || 1; $('#lBase').val(App.number(amt * rate)); }
      $('#lAmt,#lRate').on('input', recalcBase);
      $('#lCcy').on('change', function () { $('#lRate').val($(this).find(':selected').data('rate')); recalcBase(); });

      $('#btnNew').on('click', function () {
        $('#lNo').val('LC-2026-' + String(seq).padStart(3, '0'));
        $('#lParty').html('<option value="">Select supplier…</option>' + SUPPLIERS.map(s => '<option>' + s.name + '</option>').join(''));
        $('#lCcy').val('USD'); $('#lRate').val('83.50'); $('#lAmt').val('0'); recalcBase();
        $('#lIssue').val('2026-06-24'); $('#lExpiry').val('2026-09-24'); $('#lTenor').val('90 days'); $('#lGoods').val('');
        lcModal.show();
      });
      $('#lSave').on('click', function () {
        var party = $('#lParty').val(); if (!party) { App.toast('Select a party / beneficiary', 'error'); return; }
        var amt = parseFloat($('#lAmt').val()) || 0, rate = parseFloat($('#lRate').val()) || 1;
        if (amt <= 0) { App.toast('Enter the LC amount', 'error'); return; }
        DATA.unshift({ id: Date.now(), no: $('#lNo').val(), party: party, party_type: 'Supplier', bank: $('#lBank').val(),
          type: $('#lType').val(), currency: $('#lCcy').val(), amount_fc: amt, rate: rate, amount: +(amt * rate).toFixed(2),
          issue_date: $('#lIssue').val(), expiry_date: $('#lExpiry').val(), tenor: $('#lTenor').val(), goods: $('#lGoods').val(),
          linked_invoices: [], utilized: 0, status: 'Open' });
        seq++; lcModal.hide(); renderStats(); render();
        App.toast('LC ' + DATA[0].no + ' generated for ' + party + ' (demo)');
      });
    });
  </script>
</body>
</html>
