<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Balance Sheet · GoldBooks</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="../assets/css/theme.css" rel="stylesheet">
</head>
<body>
  <div class="app-wrapper">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
    <div class="main">
      <header class="topbar" id="topbar"></header>
      <main class="content">
        <div class="page-head" data-aos="fade-down">
          <div>
            <h1>Balance Sheet</h1>
            <div class="crumb">Reports · <b>Balance Sheet</b></div>
          </div>
          <div class="head-actions">
            <span class="balance-pill ok" id="bsStatus" style="padding:.5rem 1rem;border-radius:999px;font-weight:700;background:var(--success-soft);color:var(--success)"><i class="bx bx-check-circle"></i> Assets = Liabilities + Equity</span>
            <button class="btn btn-soft" onclick="printBS()"><i class="bx bx-printer"></i> Print</button>
          </div>
        </div>

        <div class="row g-3 mb-3" data-aos="fade-up">
          <div class="col-md-4"><div class="card card-hover kpi"><div class="kpi-icon blue"><i class="bx bx-buildings"></i></div><div><div class="kpi-label">Total Assets</div><div class="kpi-value" id="kAsset">₹0</div></div></div></div>
          <div class="col-md-4"><div class="card card-hover kpi"><div class="kpi-icon red"><i class="bx bx-credit-card"></i></div><div><div class="kpi-label">Total Liabilities</div><div class="kpi-value" id="kLiab">₹0</div></div></div></div>
          <div class="col-md-4"><div class="card card-hover kpi"><div class="kpi-icon gold"><i class="bx bx-pie-chart-alt"></i></div><div><div class="kpi-label">Total Equity</div><div class="kpi-value" id="kEquity">₹0</div></div></div></div>
        </div>

        <div class="row g-3">
          <div class="col-lg-6">
            <div class="card" data-aos="fade-up">
              <div class="card-pad" style="background:var(--info-soft)"><h5 class="card-title"><i class="bx bx-buildings"></i> Assets</h5></div>
              <div class="table-wrap"><table class="report-table"><tbody id="assetRows"></tbody></table></div>
            </div>
          </div>
          <div class="col-lg-6">
            <div class="card mb-3" data-aos="fade-up">
              <div class="card-pad" style="background:var(--danger-soft)"><h5 class="card-title"><i class="bx bx-credit-card"></i> Liabilities</h5></div>
              <div class="table-wrap"><table class="report-table"><tbody id="liabRows"></tbody></table></div>
            </div>
            <div class="card" data-aos="fade-up">
              <div class="card-pad" style="background:var(--gold-50)"><h5 class="card-title"><i class="bx bx-pie-chart-alt"></i> Equity</h5></div>
              <div class="table-wrap"><table class="report-table"><tbody id="equityRows"></tbody></table></div>
            </div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/print.js"></script>
  <script>
    window.printBS = function () {
      var t = document.querySelectorAll('.report-table');
      var body = '<div class="rpt-h">Assets</div>' + (t[0] ? t[0].outerHTML : '') +
        '<div class="rpt-h">Liabilities</div>' + (t[1] ? t[1].outerHTML : '') +
        '<div class="rpt-h">Equity</div>' + (t[2] ? t[2].outerHTML : '');
      App.print.report('Balance Sheet', 'As on 24 Jun 2026 · FY 2026-2027', body);
    };
    $(function () {
      AOS.init({ duration: 600, once: true });
      App.loadShell('balance-sheet');
      var CUR = '₹';

      App.data('accounts.json').done(function (d) {
        CUR = d.currency;
        var ledgers = d.accounts.filter(a => !a.is_group);
        var assets = ledgers.filter(a => a.root_type === 'Asset');
        var liab = ledgers.filter(a => a.root_type === 'Liability');
        var equity = ledgers.filter(a => a.root_type === 'Equity');
        var income = ledgers.filter(a => a.root_type === 'Income').reduce((s, a) => s + a.balance, 0);
        var expense = ledgers.filter(a => a.root_type === 'Expense').reduce((s, a) => s + a.balance, 0);
        var cye = income - expense; // current year earnings

        var totAsset = assets.reduce((s, a) => s + a.balance, 0);
        var totLiab = liab.reduce((s, a) => s + a.balance, 0);
        var totEquity = equity.reduce((s, a) => s + a.balance, 0) + cye;

        function rows(list, extra) {
          var h = list.map(a => '<tr class="indent drill" style="cursor:pointer" data-acct="' + a.code + ' · ' + a.name + '" title="View ledger"><td><span class="acct-link">' + a.code + ' · ' + a.name + '</span></td><td class="num tabular">' + App.number(a.balance) + '</td></tr>').join('');
          if (extra) h += extra;
          return h;
        }
        $('#assetRows').html(rows(assets) + '<tr class="total"><td>TOTAL ASSETS</td><td class="num tabular">' + App.number(totAsset) + '</td></tr>');
        $('#liabRows').html(rows(liab) + '<tr class="total"><td>TOTAL LIABILITIES</td><td class="num tabular">' + App.number(totLiab) + '</td></tr>');
        $('#equityRows').html(rows(equity,
          '<tr class="indent"><td>Current Year Earnings <span class="badge-soft badge-paid">from P&amp;L</span></td><td class="num tabular">' + App.number(cye) + '</td></tr>') +
          '<tr class="total"><td>TOTAL EQUITY</td><td class="num tabular">' + App.number(totEquity) + '</td></tr>');

        $(document).on('click', '.drill', function () { location.href = 'general-ledger.html?account=' + encodeURIComponent($(this).data('acct')); });
        App.countUp($('#kAsset'), totAsset, { prefix: CUR, decimals: 0 });
        App.countUp($('#kLiab'), totLiab, { prefix: CUR, decimals: 0 });
        App.countUp($('#kEquity'), totEquity, { prefix: CUR, decimals: 0 });

        var diff = +(totAsset - (totLiab + totEquity)).toFixed(2);
        if (diff !== 0) $('#bsStatus').css({ background: 'var(--danger-soft)', color: 'var(--danger)' }).html('<i class="bx bx-error-circle"></i> Out of balance by ' + App.currency(diff, CUR));
      }).fail(function () { App.toast('Serve via XAMPP http:// to load data', 'error'); });
    });
  </script>
</body>
</html>
