<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In · GoldBooks Accounting</title>
  <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">
  <link href="assets/css/theme.css" rel="stylesheet">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; background:linear-gradient(135deg,#FAF8F2 0%,#F4E9C8 100%); }
    .login-card { width:100%; max-width:920px; background:#fff; border-radius:1.2rem; box-shadow:0 20px 60px rgba(43,42,38,.15); overflow:hidden; display:flex; }
    .login-brand { flex:1; background:linear-gradient(150deg,var(--gold-500),var(--gold-700)); color:#fff; padding:3rem 2.5rem; display:flex; flex-direction:column; justify-content:space-between; position:relative; }
    .login-brand::after { content:''; position:absolute; right:-60px; bottom:-60px; width:200px; height:200px; border-radius:50%; background:rgba(255,255,255,.08); }
    .login-brand .logo { width:54px; height:54px; border-radius:14px; background:rgba(255,255,255,.2); display:grid; place-items:center; font-size:1.7rem; }
    .login-brand h2 { font-weight:800; font-size:1.7rem; margin-top:1.5rem; }
    .login-brand p { opacity:.9; font-size:.9rem; }
    .login-brand .feat { display:flex; align-items:center; gap:.6rem; font-size:.85rem; margin-top:.6rem; opacity:.95; }
    .login-form { flex:1.1; padding:2.6rem 2.4rem; }
    .login-form h3 { font-weight:800; color:var(--ink-900); }
    .role-grid { display:grid; grid-template-columns:1fr 1fr; gap:.6rem; }
    .role-btn { border:1.5px solid var(--line); border-radius:.7rem; padding:.7rem .8rem; cursor:pointer; transition:.18s; background:#fff; display:flex; align-items:center; gap:.6rem; text-align:left; }
    .role-btn:hover { border-color:var(--gold-400); background:var(--gold-50); transform:translateY(-2px); }
    .role-btn i { font-size:1.4rem; color:var(--gold-600); }
    .role-btn .rn { font-weight:700; color:var(--ink-900); font-size:.84rem; line-height:1.1; }
    .role-btn .rd { font-size:.7rem; color:var(--ink-400); }
    @media (max-width:767px){ .login-brand{ display:none; } }
  </style>
</head>
<body>
  <div class="login-card" data-aos="zoom-in">
    <div class="login-brand">
      <div>
        <div class="logo"><i class="bx bxs-bank"></i></div>
        <h2>GoldBooks</h2>
        <p>Double-entry accounting, built right.</p>
      </div>
      <div>
        <div class="feat"><i class="bx bx-check-circle"></i> Chart of Accounts &amp; Ledgers</div>
        <div class="feat"><i class="bx bx-check-circle"></i> GST Invoicing &amp; Payments</div>
        <div class="feat"><i class="bx bx-check-circle"></i> Financial Statements &amp; Reports</div>
        <div class="feat"><i class="bx bx-check-circle"></i> Bank Reconciliation</div>
      </div>
      <div style="font-size:.75rem;opacity:.8">© 2026 GoldBooks Demo Pvt Ltd</div>
    </div>
    <div class="login-form">
      <h3 class="mb-1">Welcome back 👋</h3>
      <p class="text-muted-2 mb-4">Sign in to your accounting workspace</p>

      <div class="mb-3">
        <label class="form-label">Email</label>
        <input class="form-control" id="email" value="John@yopmail.com">
      </div>
      <div class="mb-3">
        <label class="form-label">Password</label>
        <input class="form-control" id="password" type="password" value="demo1234">
      </div>
      <div class="mb-3">
        <label class="form-label">Sign in as</label>
        <select class="form-select" id="roleSelect">
          <option value="Administrator">Administrator</option>
          <option value="Accounts Manager">Accounts Manager</option>
          <option value="Accountant">Accountant</option>
          <option value="Auditor">Auditor (Read-only)</option>
        </select>
      </div>
      <button class="btn btn-gold w-100 mb-3" id="signIn"><i class="bx bx-log-in-circle"></i> Sign In</button>

      <div class="d-flex align-items-center gap-2 my-3"><div style="flex:1;height:1px;background:var(--line)"></div><span class="text-muted-2" style="font-size:.75rem">QUICK ROLE LOGIN</span><div style="flex:1;height:1px;background:var(--line)"></div></div>

      <div class="role-grid">
        <button class="role-btn" data-role="Administrator"><i class="bx bx-crown"></i><div><div class="rn">Administrator</div><div class="rd">Full access + Settings</div></div></button>
        <button class="role-btn" data-role="Accounts Manager"><i class="bx bx-briefcase"></i><div><div class="rn">Accounts Manager</div><div class="rd">All modules, no Settings</div></div></button>
        <button class="role-btn" data-role="Accountant"><i class="bx bx-calculator"></i><div><div class="rn">Accountant</div><div class="rd">Operations + entries</div></div></button>
        <button class="role-btn" data-role="Auditor"><i class="bx bx-search-alt"></i><div><div class="rn">Auditor</div><div class="rd">Read-only access</div></div></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/jquery@3.7.1/dist/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    $(function () {
      AOS.init({ duration: 500, once: true });
      function login(role) { App.setRole(role); window.location.href = 'index.html'; }
      $('#signIn').on('click', function () { login($('#roleSelect').val()); });
      $('.role-btn').on('click', function () { login($(this).data('role')); });
      $('#password').on('keypress', function (e) { if (e.which === 13) login($('#roleSelect').val()); });
    });
  </script>
</body>
</html>
